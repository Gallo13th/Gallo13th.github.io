      }
    }
    if (S.result.withheld && S.result.withheld.length)
      h += `<p class="note">尚未解锁（题量不足，本次不作任何表述）：
        ${S.result.withheld.map(f => D.recs[f].zh).join("、")}</p>`;
    card.innerHTML = h;
  }
}

/* ── 分级模式：按前缀查精度（不做线性外推）── */
const BAND_ZH = {"Very High":"很高","High":"偏高","Average":"中等",
                 "Low":"偏低","Very Low":"很低"};
/* 按**维度分块**解锁：只看该维度自己答了几题，不必等整环答满。
   实测该维度答 6 题时相关就有 0.85–0.92（见 data/network-edges.json）。 */
function domainBlock(domain) {
  const idx = TR.domainFacetIdx[domain];
  const sel = [];
  for (const fi of idx)
    for (const o of facetOrders[fi]) if (o in S.resp) sel.push(o);
  return sel;
}
function domainBand(domain, n) {
  const sel0 = domainBlock(domain);
  if (!sel0.length) return null;
  // 该维度已答满几环（每环每面向 1 题 → 每环 6 题）
  const k = Math.min(10, Math.floor(sel0.length / 6));
  const frac = sel0.length / 6;                      // 不足一环时按比例取
  const table = TR.blockDomainR[domain];
  const r = table[Math.max(0, Math.min(9, Math.ceil(frac) - 1))];
  if (r < 0.80) return null;
  const t = TR.tierDomainR.find(x => x.items >= Math.max(30, n)) || TR.tierDomainR[9];
  const sel = sel0;
  const raw = sel.reduce((s, o) => s + aligned(o, S.resp[o]), 0);
  const K = TR.domainFacetCount[domain] * 10;      // 该维度完整题数 60
  const est = Math.round(raw / sel.length * K);    // 折算成完整当量
  let band = null;
  const bt = TR.domainBands[domain] || {};
  for (const name of ["Very High","High","Average","Low","Very Low"])
    if (bt[name] && est >= bt[name][0] && est <= bt[name][bt[name].length-1])
      { band = BAND_ZH[name]; break; }
  return {r, k: sel.length, est, band, full: K,
          within1: t.within_1 / 100, off2: t.off_2plus / 100,
          complete: sel.length % 6 === 0};
}
function tierFacets(n) {
  return TR.facets.map((f, i) => {
    const k = TR.prefixFacetK[Math.min(n, 300)][i];
    const r = TR.prefixFacetR[Math.min(n, 300)][i];
    let tier = "未解锁", showable = false;
    if (k >= 3 && r != null) {
      showable = true;
      tier = r >= 0.95 ? "完整" : r >= 0.90 ? "较可靠" : r >= 0.85 ? "初步倾向" : "仅供参考";
    }
    return {facet: f, k, r, tier, showable};
  });
}

/* ── 经典模式计分 ─────────────────────────────────────────────
   口径问题：常模分带是针对**完整 10 题总分**（10–50）的，
   部分作答的小分（如 5 题，5–25）与之不可比。

   解法：把部分分**按题数折算**成 10 题当量，并用**该题集的实测精度 r**
   给出区间——r 是「这个小分与完整总分的相关」，所以
   预测完整分时的残差标准差 = SD × √(1−r²)。
   这条链路完全建立在已算好的精度表上，不需要额外假设。          */
function bandOf(f, raw) {
  const col = D.normCol[f], tab = (D.normBands[col] || {})["18-29"];
  if (!tab) return null;
  const zh = {"Very High":"很高","High":"偏高","Average":"中等","Low":"偏低","Very Low":"很低"};
  for (const name of ["Very High","High","Average","Low","Very Low"])
    if (tab[name] && raw >= tab[name][0] && raw <= tab[name][tab[name].length-1])
      return zh[name];
  return null;
}
/* SD 由分带边界反推（与 engine/assess.py 的 _sd_from_bands 同法）。
   ⚠️ 少数面向的**源常模表缺少某个分带**（已归档的源数据缺陷），
   此时反推不出 SD，也就给不出区间。**不另找办法糊过去**——
   如实说明「这个面向没有区间，因为源表缺带」。 */
function sdOf(f) {
  const col = D.normCol[f], tab = (D.normBands[col] || {})["18-29"];
  if (!tab) return null;
  try {
    const A = tab["Average"], H = tab["High"], V = tab["Very High"], L = tab["Low"];
    if (!A || !H || !V || !L) return null;        // 缺带 → 不给，而不是猜
    const p05 = (A[A.length-1] + H[0]) / 2, p15 = (H[H.length-1] + V[0]) / 2;
    const n05 = (A[0] + L[L.length-1]) / 2;
    return ((p05 - n05) + (p15 - p05)) / 2;
  } catch (e) { return null; }
}
function missingBands(f) {
  const col = D.normCol[f], tab = (D.normBands[col] || {})["18-29"];
  if (!tab) return [];
  return ["Very High","High","Average","Low","Very Low"].filter(b => !tab[b]);
}
function classicRows() {
  const rows = [];
  for (let f = 0; f < D.facets.length; f++) {
    const u = unlockOf(f);
    if (!u.lvl) continue;
    const orders = facetOrders[f].filter(o => o in S.resp);
    const k = orders.length, full = (k === 10);
    const sum = orders.reduce((s, o) =>
      s + (itemByOrder[o][3] > 0 ? S.resp[o] : 6 - S.resp[o]), 0);
    const est = full ? sum : Math.round(sum / k * 10);   // 折算成 10 题当量
    const sd = sdOf(f);
    /* 总不确定性的两个来源，缺一不可：
         · 测量误差本身——来自该面向的 α（SEM = sd·√(1−α)）
         · 部分施测误差——来自 r（sd·√(1−r²)）
       初版只算了后者，于是**完整作答时 r=1 导致区间宽度为 0 且被 falsy 判断丢掉**。
       现在把两个方差相加，两端点都正确：
         k=10 时 r=1 → 退化为 SEM；α→1 时退化为 sd·√(1−r²)。            */
    const alpha = (D.recs[f].alpha != null) ? D.recs[f].alpha : 1;
    const err = sd ? sd * Math.sqrt(Math.max(0, (1 - alpha) + (1 - (u.r || 0) ** 2)))
                   : null;
    const ci = (err != null) ? [Math.round(est - 1.96 * err), Math.round(est + 1.96 * err)]
                             : null;
    rows.push({f, k, full, sum, est, band: bandOf(f, est), ci, r: u.r, tier: u.tier,
               sd, err});
  }
  rows.sort((a, b) => (b.r || 0) - (a.r || 0));
  return rows;
}


/* ══════════════════════════════════════════════════════════════
   保存与导出

   两条原则：

   1. **数据不出本机。** 只写 localStorage 与用户主动触发的下载。
      没有任何上传路径——这是心理健康数据，不该有默认外发。

   2. **导出的报告必须带上和界面一样的诚实。**
      常模适用性、不构成诊断、每个面向的精度与其内容局限，
      一条都不能因为「报告要好看」而丢。这与契约里 must_survive
      是同一个道理：**把「我们对自己工具的批评」藏起来是不可接受的。**
   ══════════════════════════════════════════════════════════════ */
const STORE = "emohealth.session.v1";

let lastAnswered = null;      // 最近一次作答的题号（供推荐连线起点）
function saveLocal() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      v: 1, mode: S.mode, resp: S.resp, scene: S.scene, at: Date.now(),
      // 冷却时间戳必须一起存——否则刷新页面就能绕过冷却
      coolUntil: S.coolUntil || 0,
    }));
    const d = new Date();
    document.getElementById("saved").textContent =
      `已存在本机 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  } catch (e) {
    document.getElementById("saved").textContent = "本机保存不可用";
  }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (o.v !== 1 || !o.resp) return null;
    return o;
  } catch (e) { return null; }
}
function clearLocal() { try { localStorage.removeItem(STORE); } catch (e) {} }

/* ── 必须随任何导出一起走的声明 ───────────────────────────── */
function disclosures() {
  const out = [
    "参照人群为**英国**样本，非中国人群；源文件未提供样本量、招募方式与采集年份，"
      + "且分带边界来自对源常模表的反推。",
    "本结果**不构成任何诊断**，也不能替代专业评估。"
      + "若你长期情绪低落、失去兴趣，或出现伤害自己的念头，请直接寻求专业帮助。",
    "分数是**描述**，不是评价，也不是关于你的证明。",
  ];
  const w = D.facets.map((_, i) => i).filter(i => !unlockOf(i).lvl);
  if (w.length)
    out.push(`有 ${w.length} 个面向因题量不足**尚未解锁**，本报告不对它们作任何表述"
      + "——不是它们「中等」，是我们还不知道。`);
  return out;
}

/* ── 生成报告（Markdown）───────────────────────────────────── */
function buildReport() {
  const n = totalAnswered(), rows = classicRows();
  const L = [];
  const pad = x => String(x).padStart(2, "0");
  const d = new Date();
  const when = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
             + `${pad(d.getHours())}:${pad(d.getMinutes())}`;

  L.push("# EmoHealth 自测结果", "");
  const tp = TR.order.filter(o => o in S.resp).length;
  // 报告与界面一致（D99）：给**可信度**，不给层号。
  const netOk = D.facets.filter((_, i) => Math.sqrt(netR2(i)) >= UNLOCK_R
                                      && ownCount(i) >= MIN_OWN).length;
  L.push(`导出时间：${when}　｜　施测模式：`
    + `${S.mode === "tier" ? `分级模式（${netOk}/30 个面向已可信）`
        : S.mode === "scene" ? "情景模式" : "经典模式"}　｜　`
    + `完成度：${n}/${D.items.length} 题（${(n / D.items.length * 100).toFixed(1)}%）`, "");
  L.push("> 量表：IPIP-NEO-300（公共领域，Goldberg 1999）　"
    + "评分与精度基于 Johnson (2005) 网络样本 N=20,993", "");

  L.push("## 先说清楚这是什么", "");
  for (const x of disclosures()) L.push(`- ${x}`);
  L.push("");

  if (!rows.length) {
    L.push("## 结果", "");
    L.push(`**目前还没有面向跨过精度门槛，因此本报告不给出任何面向分数。**`, "");
    L.push(`每个面向需要至少 3 道题才能给出可信结果`
      + `（当前完成 ${n} 题）。单题与完整测量的相关最差只有 0.51，`
      + `那时给数字等于用噪音冒充测量。`, "");
  } else {
    L.push("## 已可解读的面向", "");
    L.push(`共 ${rows.length} / 30 个。每项都标明了它基于几道题、以及当前的精度层级。`, "");
    for (const r of rows) {
      const rec = D.recs[r.f];
      L.push(`### ${rec.zh}（${rec.domain}）`, "");
      L.push(`- **原始分**：${r.est} ／ 范围 10–50`
        + (r.full ? "" : `（由 ${r.k} 题折算成 10 题当量）`));
      L.push(`- **落带**：`
        + (r.band ? r.band : "不落在任何已发布分带内（源常模表存在覆盖空洞）"));
      if (r.ci) L.push(`- **95% 区间**：${r.ci[0]} – ${r.ci[1]}`
        + `　（基于 ${r.k}/10 题，r=${r.r.toFixed(3)}，${r.tier}）`);
      else L.push(`- **精度**：${r.k}/10 题，${r.tier}。**本面向给不出置信区间**——`
        + `源常模表缺少「${missingBands(r.f).join("、")}」带，标准差无法反推。`
        + `这是已归档的源数据缺陷，我们不以其他方式绕过去。`);
      if (rec.definition) L.push(`- **这个面向是什么**：${rec.definition}`
        + (rec.definition_provenance ? `（${rec.definition_provenance === "published_definition"
            ? "已发表定义" : "编辑澄清"}）` : ""));
      L.push("");
      if (rec.does_not_measure.length) {
        L.push("**这个分数不意味着：**", "");
        for (const x of rec.does_not_measure) L.push(`- ${x}`);
        L.push("");
      }
      if ((rec.boundaries || []).length) {
        L.push("**容易与什么混淆：**", "");
        for (const b of rec.boundaries)
          L.push(`- 与「${b.against}」的区别：${b.distinction}`);
        L.push("");
      }
      if (rec.caveats.length) {
        L.push("**读这个分数时需要注意（内容局限，不可删减）：**", "");
        for (const x of rec.caveats) L.push(`- ${x}`);
        L.push("");
      }
    }
    const w = D.facets.map((_, i) => i).filter(i => !unlockOf(i).lvl);
    if (w.length) {
      L.push("## 尚未解锁的面向", "");
      L.push(w.map(i => D.recs[i].zh).join("、") + "。", "");
      L.push("这些面向的题量还不够。**本报告不对它们作任何表述**——"
        + "包括不说它们「大概是中等」。", "");
    }
  }

  if (S.mode === "scene") {
    const done = sceneItems.filter((_, i) => sceneDone(i)).length;
    L.push("## 情景完成情况", "");
    for (let i = 0; i < D.scenes.length; i++) {
      const c = sceneCount(i), t = sceneItems[i].length;
      L.push(`- ${sceneDone(i) ? "✅" : "　"} ${D.sceneNames[i]}　${c}/${t}`);
    }
    L.push("");
    const R = done ? sceneResult(0) : null;
    if (R && R.B) {
      L.push("### 情景中的你 与 平时的你", "");
      L.push(`（基于 ${R.B.n} 个情景；你在全部已答题上的平均位置 ${R.B.own}／5）`, "");
      if (R.B.up.length) {
        L.push("比平时更靠高端的：", "");
        for (const x of R.B.up)
          L.push(`- +${x.d}　${D.recs[x.f].zh}　「${x.tx}」选了 ${x.v}`);
        L.push("");
      }
      if (R.B.dn.length) {
        L.push("比平时更靠低端的：", "");
        for (const x of R.B.dn)
          L.push(`- ${x.d}　${D.recs[x.f].zh}　「${x.tx}」选了 ${x.v}`);
        L.push("");
      }
    }
    if (done) {
      L.push("> ⚠️ 情景面板里的每一项都**仅基于 1 道题**，是**作答位置的描述**，"
        + "不是该面向的测量结果。", "");
    }
  }

  L.push("## 关于这份报告的说明", "");
  L.push("- 分数由固定算法从你的作答算出，没有经过任何 AI 改写。");
  L.push("- 数据只存在你的设备上；本工具没有上传路径。");
  L.push(`- 报告生成于 ${when}。内容随作答进度变化，完成更多题目后重新导出即可。`);
  L.push("");
  return L.join("\n");
}

/* ── 导出 ───────────────────────────────────────────────────── */
function download(name, text, mime) {
  const b = new Blob([text], {type: mime + ";charset=utf-8"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function stamp() {
  const d = new Date(), p = x => String(x).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-`
       + `${p(d.getHours())}${p(d.getMinutes())}`;
}
function exportJSON() {
  const payload = {
    format: "emohealth.session.v1",
    exported_at: new Date().toISOString(),
    instrument: "IPIP-NEO-300",
    mode: S.mode,
    responses: S.resp,
    scene: S.scene,
    progress: {answered: totalAnswered(), total: D.items.length},
    unlock: Object.fromEntries(D.facets.map((_, i) => {
      const u = unlockOf(i);
      return [D.facets[i], {k: u.k, r: u.r, tier: u.tier, showable: u.lvl > 0}];
    })),
    disclosures: disclosures(),
  };
  download(`emohealth-存档-${stamp()}.json`,
           JSON.stringify(payload, null, 1), "application/json");
  toast("存档已导出——可在另一台设备导入继续");
}
function exportMD() {
  download(`emohealth-结果-${stamp()}.md`, buildReport(), "text/markdown");
  toast("报告已导出");
}
function exportCSV() {
  const rows = [["题号", "面向", "情景", "计分键", "题面", "你的作答", "该选项位置%"]];
  for (const o of D.items.map(i => i[0])) {
    const it = itemByOrder[o], v = S.resp[o];
    if (v == null) continue;
    const a = aligned(o, v);
    rows.push([o, D.recs[it[1]].zh, D.sceneNames[it[2]],
               it[3] > 0 ? "正向" : "反向", it[4], v, D.optionPct[o-1][a-1]]);
  }
  const csv = "\ufeff" + rows.map(r =>
    r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  download(`emohealth-作答-${stamp()}.csv`, csv, "text/csv");
  toast(`已导出 ${rows.length - 1} 条作答`);
}
function importJSON(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (o.format !== "emohealth.session.v1" || !o.responses)
        throw new Error("格式不符");
      S.resp = {}; S.result = null;
      for (const [k, v] of Object.entries(o.responses)) S.resp[+k] = +v;
      if (o.mode) { S.mode = o.mode;
        document.querySelectorAll("#modes button").forEach(b =>
          b.classList.toggle("on", b.dataset.m === o.mode)); }
      S.scene = null;
      saveLocal(); renderTop(); renderTree(); renderStage(); renderResult();
      toast(`已导入 ${totalAnswered()} 题作答`);
    } catch (e) { toast("导入失败：" + e.message); }
  };
  fr.readAsText(file, "utf-8");
}

/* ── 交互 ───────────────────────────────────────────── */
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ── 天赋树的点击 ─────────────────────────────────── */
document.addEventListener("click", (e) => {
  if (S.mode !== "tier") return;
  const nd = e.target.closest(".nd");
  if (nd) {
    if (nd.classList.contains("locked")) { toast("这一环还没解锁"); return; }
    if (isCooling()) { toast(`冷却中，还需 ${Math.ceil(coolingLeft()/1000)} 秒`); return; }
    S.tierSel = {f: +nd.dataset.f, t: +nd.dataset.t, o: +nd.dataset.o};
    refreshAdapt();                       // 连线跟随选中的已答节点
    // ⚠️ 必须调 renderTierTree()（它负责「下一题」常驻区），不是 renderTierPanel()。
    //    常驻区从面板里搬出去之后，这里漏改过一次：点节点能选中、图上高亮也对，
    //    但**作答区的题干与选项不出现**——因为 panel 已经不再渲染那道题了（D107）。
    //    同类的还有 #redo 那条路，一起改。
    renderTierGraph(); renderTierTree();
    document.querySelectorAll(".nd.sel").forEach(x => x.classList.remove("sel"));
    nd.classList.add("sel");
    return;
  }
  if (e.target.id === "redo" && S.tierSel) {
    delete S.resp[S.tierSel.o];
    refreshAdapt();
    saveLocal(); renderTop(); renderTree(); renderTierGraph(); renderTierTree();
    return;
  }
  // 面板里的作答按钮
  if (e.target.closest("#peektoggle")) { togglePeek(); return; }
  if (e.target.closest("#ptoggle")) {
    S.panelOpen = !S.panelOpen;
    renderTierGraph(); renderTierTree();
    return;
  }
  // 「下一题」常驻区：点推荐卡片 = 选中那道题（与点图上圆圈等价）
  const nq = e.target.closest("[data-pick]");
  if (nq) {
    if (isCooling()) { toast(`冷却中，还需 ${Math.ceil(coolingLeft()/1000)} 秒`); return; }
    const o = +nq.dataset.pick;
    S.tierSel = {f: itemByOrder[o][1], t: tierRingOfOrder(o), o};
    refreshAdapt();
    renderTierGraph(); renderTierTree();
    return;
  }
  if (e.target.closest(".peekbody")) return;      // 折叠区内部点击不当作答
  // ⚠️ 作答按钮现在有**两个**可能的位置：常驻区（#nextq，D105 之后的主要入口）
  //    与面板。只写 `#tierpanel .opt` 会让常驻区里的选项「点了不算数」——
  //    这是 D107 那次搬迁遗留的同一类遗漏（第 4 处）。
  const opt = e.target.closest("#nextq .opt, #tierpanel .opt");
  if (opt && isCooling()) { toast(`冷却中，还需 ${Math.ceil(coolingLeft()/1000)} 秒`); return; }
  if (opt && S.tierSel) {
    const v = +opt.dataset.v, o = S.tierSel.o;
    // 作答后这条支线可能往前长一节，所以提示要按**面向**说，不按「层」（D99）
    const beforeReady = readyFacets().length;
    S.resp[o] = v;
    refreshAdapt(o);
    lastAnswered = o;
    refreshAdapt();
    saveLocal(); renderTop(); renderTree(); renderTierGraph(); renderTierTree();
    const nowReady = readyFacets().length;
    if (nowReady > beforeReady) toast(`又有一个面向达到可信（${nowReady}/30）`);
    document.querySelectorAll(".nd.sel").forEach(x => x.classList.remove("sel"));
    return;
  }
});

document.getElementById("stage").addEventListener("click", (e) => {
  if (S.mode === "tier") return;
  const chip = e.target.closest("[data-scene]");
  if (chip) { S.scene = +chip.dataset.scene; renderStage(); return; }
  const opt = e.target.closest(".opt");
  if (!opt) return;
  const v = +opt.dataset.v;
  const pending = (S.mode === "tier" ? TR.order
                 : S.mode === "scene" ? sceneItems[S.scene]
                 : D.items.map(i => i[0]))
    .filter(o => !(o in S.resp));
  const o = pending[0];
  const before = S.mode === "scene"
    ? sceneItems[S.scene].filter(x => x in S.resp).length : totalAnswered();
  S.resp[o] = v;

  if (S.mode === "scene" && sceneDone(S.scene)) {
    S.result = {type: "scene", si: S.scene};
    const nU = D.facets.filter((_, i) => unlockOf(i).lvl > 0).length;
    toast(`「${D.sceneNames[S.scene]}」完成 · 已解锁 ${nU}/30 个面向`);
  } else if (S.mode === "tier" && TR.tierItems.includes(totalAnswered())) {
    S.result = {type: "tier", n: totalAnswered()};
    const t = TR.tierItems.indexOf(totalAnswered()) + 1;
    toast(`第 ${t} 层完成`);
  } else if (S.mode === "classic" && totalAnswered() % 30 === 0) {
    const rounds = totalAnswered() / 30;
    if (rounds >= 3) { S.result = {type: "classic", rows: classicRows(),
                                    withheld: D.facets.map((_, i) => i).filter(i => !unlockOf(i).lvl)}; }
    toast(`第 ${rounds} 轮完成`);
  }
  saveLocal();
  renderTop(); renderTree(); renderStage();
  refreshAdapt(); tickCool(); renderResult();
  if (S.mode === "scene" && sceneDone(S.scene)) {
    const firstOpen = sceneItems.findIndex((_, i) => !sceneDone(i));
    if (firstOpen >= 0) S.scene = firstOpen;
    renderStage();
  }
});

/* ── 保存与导出的交互 ───────────────────────────────── */
(function wireIO() {
  const menu = document.getElementById("menu");
  document.getElementById("btn-export").addEventListener("click", (e) => {
    e.stopPropagation(); menu.classList.toggle("on");
  });
  document.addEventListener("click", () => menu.classList.remove("on"));
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("[data-x]"); if (!b) return;
    menu.classList.remove("on");
    const x = b.dataset.x;
    if (x === "md") exportMD();
    else if (x === "json") exportJSON();
    else if (x === "csv") exportCSV();
    else if (x === "import") document.getElementById("file").click();
    else if (x === "copy") {
      const t = buildReport();
      if (navigator.clipboard && location.protocol !== "file:")
        navigator.clipboard.writeText(t).then(() => toast("报告已复制"),
                                               () => toast("复制被浏览器拒绝，请用导出"));
      else {
        // file:// 下 clipboard API 常被拒，退回手选
        const ta = document.createElement("textarea");
        ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast("报告已复制"); }
        catch (err) { toast("复制不可用，请改用导出"); }
        ta.remove();
      }
    }
  });
  document.getElementById("file").addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("btn-clear").addEventListener("click", () => {
    const n = totalAnswered();
    if (!n) { toast("还没有作答"); return; }
    if (!confirm(`清空本机保存的 ${n} 题作答？此操作不可撤销。\n`
      + `（若想留底，请先「导出 → 存档」）`)) return;
    S.resp = {}; S.result = null; S.scene = null; clearLocal();
    document.getElementById("saved").textContent = "";
    renderTop(); renderTree(); renderStage();
  refreshAdapt(); tickCool(); renderResult();
    toast("已清空");
  });
})();

document.getElementById("modes").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#modes button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  S.mode = b.dataset.m;
  S.result = null;
  if (S.mode === "scene" && S.scene === null) S.scene = 0;
  if (S.mode === "tier") {
    const p = TR.order.filter(o => o in S.resp).length;
    if (TR.tierItems.includes(p)) S.result = {type: "tier", n: p};
  }
  renderTop(); renderTree(); renderStage();
  refreshAdapt(); tickCool(); renderResult();
});

/* ── 启动：先看本机有没有未完成的作答 ─────────────────── */
(function boot() {
  const saved = loadLocal();
  if (saved && Object.keys(saved.resp).length) {
    const n = Object.keys(saved.resp).length;
    const d = new Date(saved.at || Date.now());
    const p = x => String(x).padStart(2, "0");
    const when = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
               + `${p(d.getHours())}:${p(d.getMinutes())}`;
    if (confirm(`发现本机保存的作答：${n} 题（${when}）。\n\n`
      + `点「确定」继续作答，点「取消」从头开始（不会删除存档）。`)) {
      S.resp = {};
      for (const [k, v] of Object.entries(saved.resp)) S.resp[+k] = +v;
      if (saved.mode) S.mode = saved.mode;
      S.scene = saved.scene ?? null;
      S.coolUntil = saved.coolUntil || 0;      // 冷却跨刷新继续有效
      document.querySelectorAll("#modes button").forEach(b =>
        b.classList.toggle("on", b.dataset.m === S.mode));
      document.getElementById("saved").textContent = `已恢复 ${when}`;
    } else {
      document.getElementById("saved").textContent = `本机存档 ${n} 题`;
    }
  }
  renderTop(); renderTree(); renderStage();
  refreshAdapt(); tickCool();
})();
</script>
