  };
  download(`${e.code}-存档-${stamp()}.json`,
           JSON.stringify(payload, null, 1), "application/json");
}

/* ── 分带命中判定（**唯一实现**，null 安全的边界处理）────────────────────────
   数据层的分带：`lo`/`hi` 为 **null = 无界**（−∞ / +∞），并带
   `lo_inclusive`/`hi_inclusive`（数据侧有闭合断言保证铺满无重叠）。
   ⚠️ **不能拿 null 直接做数值比较**：JS 里 `null < 55` 是 `true`（null→0），
   会静默把「无下界」当成「>0」。这里显式换成 ±Infinity；
   兼容旧数据（无 `*_inclusive` 字段时按闭区间）。 */
function bandHit(b, v) {
  if (!b || v == null) return false;
  const x = Number(v);
  if (!Number.isFinite(x)) return false;
  const lo = (b.lo == null) ? -Infinity : Number(b.lo);
  const hi = (b.hi == null) ? Infinity : Number(b.hi);
  const loOk = (b.lo_inclusive === undefined) ? (x >= lo)
    : (b.lo_inclusive ? (x >= lo) : (x > lo));
  const hiOk = (b.hi_inclusive === undefined) ? (x <= hi)
    : (b.hi_inclusive ? (x <= hi) : (x < hi));
  return loOk && hiOk;
}

/* ── 判读：门槛型 / 分界 / 分带 / 逐项 / T 分型 —— **唯一实现** ──────────────
   结果页渲染与导出（MD/CSV/JSON）都走这里，纯数据、不含 HTML：
   一处改了另一处不会走样，导出也不会出现「自己再算一套」。
   数据来源：`data.interpretation`（L1 门槛）与 `data.criteria`（L2 八册），
   分值与 `S.instResult.rows`（= `instAggregate`/`instScores` 的结果）。 */
function instJudgment(data) {
  const it = data.interpretation || {};
  const cr = data.criteria || {};
  const rows = (S.instResult && S.instResult.rows) || [];
  const byName = new Map(rows.map(r => [r.name, r]));

  if (it.kind === "threshold") {
    const doms = (it.domains || []).map(d => {
      const r = byName.get(d.domain);
      const v = r ? r.value : null;
      const complete = r ? !!r.complete : false;
      const reached = v != null && v >= d.threshold;
      /* ⚠️ 域分是**域内最高分**：部分作答时「达到门槛」是可靠的正向结论，
         但「未达门槛」**不可靠**（未答的题可能是高分）→ 输出「未答完，不能判定」。 */
      return {domain: d.domain, value: v, threshold: d.threshold,
        threshold_label: d.threshold_label || "", level2: d.level2 || null,
        answered: v != null, complete,
        decidable: reached || complete,
        reached};
    });
    const p = it.pid5_interface;
    const pf = (p && p.status === "inferred") ? byName.get(p.from_domain) : null;
    return {
      kind: "threshold",
      scoring: it.scoring || "",
      disclaimer: it.disclaimer || "",
      domains: doms,
      hit: doms.filter(x => x.reached).length,
      low_threshold_domains: (it.domains || []).filter(d => d.threshold === 1)
        .map(d => d.domain),
      pid5_interface: (p && p.status === "inferred") ? {
        status: p.status, from_domain: p.from_domain, to: p.to || "PID-5",
        reached: !!(pf && pf.value != null && pf.value >= 2),
      } : null,
    };
  }
  if (cr.kind) {
    const kv = rows.length === 1 ? rows[0].value : null;
    const n = rows.length === 1 ? rows[0].n_answered : 0;
    /* ── T 分（Phase 2）：有官方 raw→T 转换表就算，**只查表**、不内插不外推 ──
       ⚠️ 未答满不给：域分是域内**最高分**，部分作答时只是下界 → 算出的 T 会偏低。 */
    const row0 = rows.length === 1 ? rows[0] : null;
    const domainComplete = row0 ? !!row0.complete : false;
    const tScore = (() => {
      if (!cr.tscore_table) return null;
      if (!row0 || row0.value == null) {
        return {found: false, reason: "该域未答：没有原始分可查表"};
      }
      if (!domainComplete) {
        return {found: false, raw: row0.value,
          reason: `该域未答满（${row0.n_answered}/${row0.n_items}）：域分是域内最高分、`
            + `部分作答时只是**下界**，据此算出的 T 会偏低，因此不给 T 分`};
      }
      return instTScoreDetail(data, row0.value);
    })();
    /* T 单位的分带（`criteria.bands` 非空时才用）：**null 安全**的命中判定，
       并把分带出处（APA 册子 p.9）与 T 表出处（PROMIS 官方 manual）**分开带出**。 */
    const tBand = (tScore && tScore.found && Array.isArray(cr.bands) && cr.bands.length)
      ? (cr.bands.find(b => bandHit(b, tScore.T)) || null) : null;
    const bandsMeta = (Array.isArray(cr.bands) && cr.bands.length) ? {
      source: cr.bands_source || null,
      bands: cr.bands.map(b => ({label: b.label, lo: b.lo == null ? null : b.lo,
        hi: b.hi == null ? null : b.hi, lo_inclusive: b.lo_inclusive,
        hi_inclusive: b.hi_inclusive, verbatim: b.verbatim || ""})),
    } : null;

    if (cr.kind === "per_item") {
      const items = (INST_NOW.items || []).map(x => ({
        order: x.order, id: x.id, zh: x.zh || x.text, en: x.en || x.text || "",
        value: (x.id in S.instResp) ? S.instResp[x.id] : null,
      }));
      return {kind: "per_item", scale: cr.scale || "",
        aggregate_label: cr.aggregate_label || "", notes: cr.notes || "",
        value: kv, answered: n, items,
        n_positive: items.filter(x => x.value > 0).length};
    }
    if (cr.kind === "severity_bands" || cr.kind === "cutoff") {
      const bands = (cr.bands || []).map(b => ({lo: b.lo, hi: b.hi, label: b.label,
        lo_inclusive: b.lo_inclusive, hi_inclusive: b.hi_inclusive,
        verbatim: b.verbatim || ""}));
      const band = bands.find(b => bandHit(b, kv)) || null;
      return {kind: cr.kind, scale: cr.scale || "", sum_range: cr.sum_range || [],
        cutoff: (cr.cutoff == null ? null : cr.cutoff), value: kv,
        answered: rows.length === 1 ? n : 0, bands,
        band: band ? band.label : null, notes: cr.notes || "",
        bands_meta: bandsMeta,
        complete: domainComplete, tscore: tScore, t_band: tBand ? tBand.label : null};
    }
    if (cr.kind === "t_score") {
      return {kind: "t_score", scale: cr.scale || "", sum_range: cr.sum_range || [],
        value: kv, answered: n, complete: domainComplete,
        tscore_table: !!cr.tscore_table, tscore: tScore,
        t_band: tBand ? tBand.label : null,
        bands_meta: bandsMeta,
        metric: (cr.tscore_table && cr.tscore_table.metric) || "",
        notes: cr.notes || ""};
    }
  }
  return null;
}

/* ── 推断估计（唯一实现来自 ui/lib/inference.js 的 predictFrom）──────────────
   导出与面板共用；**硬规则**：本维度一题未答 → 不给估计、不给置信度。 */
function instInferenceTable(data, e) {
  if (!e || !e.code) return null;
  const payload = inferencePayload(e.code);
  const lib = window.EmoHealthInference;
  if (!payload || !payload.params || !lib || typeof lib.predictFrom !== "function") return null;
  /* ⚠️ 直接调库（**唯一推断实现**），不用面板那份带缓存的 `currentPrediction`——
     导出可能与面板渲染时刻不同步（作答后未重绘），那样会导出与作答不一致的估计，
     甚至出现「1/8 已答」却被判成「一题未答」这种自相矛盾（缺陷 1/2 的根因之一）。 */
  let pred = null;
  try { pred = lib.predictFrom(payload, S.instResp); } catch (err) { return null; }
  if (!pred || pred.error) return null;
  const p = payload.params || {};
  const dims = Object.keys(p.dim_items || {});
  const rows = dims.map(dim => {
    const b = (pred.inferred || {})[dim];
    if (!b) return null;
    return {dim, name: b.name || dimNameOf(p, dim),
      allowed: !!b.display_allowed, available: !!b.available,
      confidence_r: b.display_allowed ? b.confidence_r : null,
      estimate: b.display_allowed && b.available ? b.predicted_score : null,
      n_answered_own: b.n_answered_own || 0,
      n_items: b.n_items || (p.dim_items[dim] || []).length,
      /* task-41：`dim_ceiling_cross` 是**答满该维度时的 conf_r**（信度型上限）。
         报告在「已答满」的行里展示它，但**必须改名**（叫「维度信度上限」），
         否则读者会把它当成「我的得分只有 93% 可信」。 */
      ceiling_cross: (payload.dim_ceiling_cross && payload.dim_ceiling_cross[dim] != null)
        ? payload.dim_ceiling_cross[dim] : null,
      ceiling_self: (payload.dim_ceiling && payload.dim_ceiling[dim] != null)
        ? payload.dim_ceiling[dim] : null,
      ceiling_pct: b.ceiling_pct == null ? null : b.ceiling_pct,
      ceiling_need: b.ceiling_need == null ? null : b.ceiling_need,
      status: b.status || "", reason: b.reason || ""};
  }).filter(Boolean);
  rows.sort((a, b) => a.name.localeCompare(b.name));
  return {rows, n_allowed: rows.filter(x => x.allowed).length,
    n_ready: rows.filter(x => x.available).length, n_total: rows.length,
    model: (payload.model && payload.model.name) || null,
    formula: (payload.model && payload.model.formula) || null,
    item_dim_corr_kind: p.item_dim_corr_kind || payload.item_dim_corr_kind || null,
    ceiling_ratio: p.ceiling_ratio == null ? null : p.ceiling_ratio,
    ceiling_ratio_source: p.ceiling_ratio_source || null,
    ceiling_note: payload.ceiling_note || "",
    ceiling_cross_note: payload.ceiling_cross_note || "",
    n_dims_payload: payload.n_dims == null ? null : payload.n_dims,
    layer_note: pred.layer_note || "", hard_rule: (payload.model && payload.model.hard_rule) || ""};
}

/* PID-5 条件常模的**分层敏感度**（披露用，数字来自 Lead + confidence-judge 的
   三重独立复核，2026-10-06；导出只**照报**这两个数，不自行推算）：
     · 9 个性别×年龄分层 + overall 层之间，同一 raw 的百分位**全局最大跨度 45.93 个百分点**
       （例：deceitfulness raw=0.6 → f [65,Inf) 79.02 vs m [18,35) 33.09）
     · 若恒定使用第一层 `f [18,35)`（旧行为），相对真实分层**最大偏差 32.98 个百分点**
       （例：deceitfulness raw=0.5 → f [18,35) 38.73 vs f [65,Inf) 71.71） */
const PID5_LAYER_SENSITIVITY = {
  max_span_pp: 45.93,
  first_cell_max_dev_pp: 32.98,
  max_span_example: "deceitfulness raw=0.6：f [65,Inf)=79.02 vs m [18,35)=33.09",
  first_cell_example: "deceitfulness raw=0.5：f [18,35)=38.73 vs f [65,Inf)=71.71",
  verified_by: "Lead + confidence-judge 三重独立复核（2026-10-06）",
};

/* ══ 报告模型（**导出三件套的唯一数据源**）════════════════════════════════════
   一次算出：元数据、得分总表、逐维度细则、判读（门槛/分带）、推断表、常模说明。
   MD / 结果明细 CSV / 存档 JSON 都从这里取数——「一个数一个来源」。 */
function instReport(data, e) {
  const rows = instRows(data);
  const answered = rows.filter(r => r.value !== "").length;
  const nrm = data.norms || null;
  const hasNorms = !!(nrm && (nrm.facets || nrm.domains || nrm.scales));
  const rrows = (S.instResult && S.instResult.rows) || [];
  const infer = instInferenceTable(data, e);
  const inferByName = new Map((infer ? infer.rows : []).map(x => [x.name, x]));
  const dimName = new Map((data.dimensions || []).map(d => [d.id, d.name]));
  const revCount = id => (data.scoring[id] || {}).of
    ? (data.scoring[id].of.filter(iid => {
        const it = (data.items || []).find(x => x.id === iid);
        return it && it.key === -1;
      }).length) : 0;

  /* ── 每一行的分类与位置（D122 修正：缺陷 1/2/3）────────────────────────────
     `state` **只由真实原因决定**，绝不用「一题未答」兜底：
       · unanswered  : n_answered === 0            → 硬规则：不给估计/置信度/位置
       · insufficient: n_answered > 0 但置信度未达门槛 → 说明真实原因（不是「未答」）
       · estimated   : 可给估计（conf_r ≥ 门槛）      → 估计分 + 位置（**按估计分算**，明确标注）
       · measured    : 该维度**答满**（complete）      → 才有「实测位置」（用完整原始分查常模）
     ⚠️ **绝不用部分作答的原始分查常模**：部分均值 ≠ 完整维度得分（缺陷 3）。
        用户在意的「位置」用**估计分**给，并明确标注它不是实测位置。 */
  const missingNormEntries = [];
  /* 用户填的分层（PID-5 条件常模）；没填 / 不适用 → null，入口会走默认总体层。
     只在**这一个变量**里解析一次，本函数里所有百分位查询都用它（含下面没有
     `instResult` 时的「估计表」分支——那个分支在 map 之外，所以必须声明在函数级）。 */
  const REQ_CELL = (data.norms && data.norms.scales) ? stratumRequestedCell() : null;
  const scoreRows = rrows.map(r => {
    const rule = data.scoring[r.id] || {};
    const b = inferByName.get(r.name) || null;
    const nAns = r.n_answered;
    const full = !!r.complete;
    /* ⚠️ 没有推断模型（L1/L2 八册）时**不存在「置信度门槛」这回事**：
       状态按「未答 / 未答满 / 答满」如实分，绝不套用推断那套文案。 */
    const state = !infer
      ? (nAns === 0 ? "unanswered" : (full ? "complete" : "partial"))
      : ((nAns === 0) ? "unanswered"
        : ((b && b.allowed && b.available) ? "estimated" : "insufficient"));
    const est = (state === "estimated" && !full) ? b.estimate : null;
    const rAll = (b && b.allowed) ? b.confidence_r : null;
    /* task-41：**答满的维度没有「估计」**——分数是实测的，位置也是实测的。
       「估计分 / 估计位置 / 置信度 r」这三个概念只对**未答满**的维度成立。
       答满时那个 r 的真正含义是「**维度信度上限**」（`dim_ceiling_cross`），
       必须改名展示，并写明「这不是你这次得分的置信度」。 */
    const ceilingR = full
      ? ((b && b.ceiling_cross != null) ? b.ceiling_cross : rAll)
      : null;
    /* 实测位置：**只有答满才有**（否则 null，且写明原因） */
    const nd = (full && hasNorms) ? instPercentileDetail(data, r.name, r.value, REQ_CELL) : null;
    if (full && hasNorms && !nd) missingNormEntries.push(r.name);
    /* 估计位置：按估计分查常模（只对**未答满**的维度成立） */
    const ndEst = (state === "estimated" && !full && hasNorms)
      ? instPercentileDetail(data, r.name, est, REQ_CELL) : null;
    /* Phase 2：L2 的官方 raw→T **查表**（只查表；未答满/超范围一律不给） */
    const tsc = (data.criteria && data.criteria.tscore_table)
      ? (full ? instTScoreDetail(data, r.value)
        : {found: false, raw: r.value,
          reason: `该域未答满（${nAns}/${r.n_items}）：域分是域内最高分、部分作答时只是**下界**，`
            + `据此算出的 T 会偏低，因此不给 T 分`})
      : null;
    const note = state === "unanswered"
      ? "本维度一道题都没答：按硬规则不给估计、置信度与位置"
      : (state === "insufficient"
        ? `已答 ${nAns}/${r.n_items} 题，信息量不足（置信度 r=${rAll == null ? "—" : (+rAll).toFixed(4)} 未达展示门槛），暂不给估计与位置`
        : (state === "partial"
          ? `已答 ${nAns}/${r.n_items} 题（**未答满**）：本册没有推断模型与常模，`
            + `因此不给估计与位置；判读见上面的门槛/分带表`
          : ""));
    return {
      id: r.id, name: r.name, value: r.value, n_answered: nAns,
      n_items: r.n_items, complete: full, is_domain: !!r.isDomain,
      aggregation: rule.aggregation || "",
      reverse_items: revCount(r.id),
      state,
      estimate: est, confidence_r: rAll, estimate_note: note,
      /* 实测位置（答满才有） */
      measured: !!nd,
      pctl: nd ? nd.pctl : null, pctl_lo: nd && nd.pctl_lo != null ? nd.pctl_lo : null,
      pctl_hi: nd && nd.pctl_hi != null ? nd.pctl_hi : null,
      /* T 分：优先常模来源直接给的（PID-5 条件常模）；否则 L2 的官方 raw→T **查表**。
         ⚠️ 查表只在**答满**时做（部分作答的域分只是下界）。 */
      T: (nd && nd.T != null) ? nd.T : (tsc && tsc.found ? tsc.T : null),
      T_lo: nd && nd.T_lo != null ? nd.T_lo : null,
      T_hi: nd && nd.T_hi != null ? nd.T_hi : null,
      SE: (tsc && tsc.found && tsc.SE != null) ? tsc.SE : null,
      T_source: (nd && nd.T != null) ? "常模来源直接给（条件常模）"
        : ((tsc && tsc.found) ? "查表：官方 raw→T 转换表" : ""),
      T_reason: (!nd || nd.T == null) ? ((tsc && !tsc.found) ? tsc.reason : "") : "",
      z: nd && nd.z != null ? nd.z
        : ((nd && nd.T != null) || (tsc && tsc.found)
          ? Math.round(((((nd && nd.T) || (tsc && tsc.T)) - 50) / 10) * 100) / 100 : null),
      z_from: nd && nd.z != null ? "mean/sd"
        : ((nd && nd.T != null) ? "由来源 T 分换算 (T-50)/10"
          : ((tsc && tsc.found) ? "由**查表 T 分**换算 (T-50)/10" : "")),
      mean: nd && nd.mean != null ? nd.mean : null,
      sd: nd && nd.sd != null ? nd.sd : null,
      /* z 本身就是「距均值多少个 SD」；两者必须一致（缺陷：同列不给值却给了 z 自相矛盾） */
      sd_from_mean: nd && nd.z != null ? nd.z
        : ((nd && nd.sd_from_mean != null) ? nd.sd_from_mean
          : ((tsc && tsc.found) ? Math.round((tsc.T - 50) / 10 * 100) / 100 : null)),
      sd_lo: nd && nd.sd_lo != null ? nd.sd_lo : null,
      sd_hi: nd && nd.sd_hi != null ? nd.sd_hi : null,
      sd_unavailable_reason: (nd && nd.sd_lo == null)
        ? "条件常模没有 mean/SD（只给百分位与 T 分及其 95% 区间），所以 ±1SD 是**原始分单位**的区间、给不出来；z 是标准化单位，见「距均值(SD)」列"
        : ((tsc && tsc.found)
          ? "T 分型册子只给 raw→T 转换表（没有 mean/SD），所以 ±1SD 是原始分单位的区间、给不出来；z/距均值(SD) 由 T 换算"
          : ""),
      /* T 转换表的溯源（导出该有的细则） */
      t_table: tsc ? {
        form: tsc.form, metric: tsc.metric, raw_range: tsc.raw_range,
        completeness: tsc.completeness, table_title: tsc.table_title,
        source: tsc.source,
      } : null,
      /* 实测位置为什么没有 */
      measured_note: nd ? ""
        : (!full
          ? `未答满（${nAns}/${r.n_items}）：**不用部分作答的原始分查常模**（部分均值 ≠ 完整维度得分），所以不给实测百分位/T/z`
          : (hasNorms ? "该维度在这套常模里没有对应条目（**已单独报告 Lead**）" : "本量表没有可用常模")),
      /* 估计位置（按估计分）：**只对未答满的维度成立**（答满时 ndEst 必为 null） */
      est_pctl: ndEst ? ndEst.pctl : null,
      est_T: ndEst && ndEst.T != null ? ndEst.T : null,
      est_z: ndEst && ndEst.z != null ? ndEst.z
        : (ndEst && ndEst.T != null ? Math.round((ndEst.T - 50) / 10 * 100) / 100 : null),
      est_note: ndEst
        ? `按**估计分**（${(+est).toFixed(2)}）算出的位置：基于已答 ${nAns}/${r.n_items} 题、`
          + `置信度 r=${rAll == null ? "—" : (+rAll).toFixed(4)}——**不是实测位置**，`
          + `**不等于你答满时会得到的分数**`
        : "",
      /* task-41：「该维度是否答满」的三个显式标记 + 信度上限 */
      complete: full,
      est_applicable: ndEst != null || (est != null),
      ceiling_r: ceilingR,
      ceiling_cross_note: (infer && full) ? (infer.ceiling_cross_note || "") : "",
      cell: nd ? (nd.cell || "") : (ndEst ? (ndEst.cell || "") : ""),
      cell_is_default: (nd || ndEst) ? !!(nd || ndEst).cell_is_default : false,
      cell_fallback: (nd || ndEst) ? !!(nd || ndEst).cell_fallback : false,
      cell_default: (nd || ndEst) ? !!(nd || ndEst).cell_default : false,
      /* task-39：`cell_reason` 区分「你填的 / 默认 / 回退」，措辞只在下面这一处生成 */
      cell_reason: (nd || ndEst) ? ((nd || ndEst).cell_reason || "") : "",
      cell_requested: (nd || ndEst) ? ((nd || ndEst).cell_requested || "") : "",
      default_cell: (nd || ndEst) ? ((nd || ndEst).default_cell || "") : "",
      cell_source: !(nd || ndEst) ? "" : (() => {
        const m = nd || ndEst;
        return (m.cell_reason === "user") ? `你填写的分层 ${m.cell}`
          : (m.cell_reason === "fallback")
            ? `回退：你填写的分层 ${m.cell_requested} 在本册不存在 → 用总体层 ${m.cell}`
            : (m.cell_reason === "fallback-norm")
              ? `回退：数据源没有 overall 层 → 取第一层 ${m.cell}`
              : `默认总体层 ${m.cell}（你没填性别与年龄）`;
      })(),
      n_cells: (nd || ndEst) ? ((nd || ndEst).n_cells || 0) : 0,
      extrap: nd ? !!nd.extrap : false,
      facet_id: (nd || ndEst) ? ((nd || ndEst).facet_id || (nd || ndEst).scale_id || "") : "",
      percentile_method: (nd || ndEst) ? ((nd || ndEst).percentile_method || "") : "",
    };
  });
  /* 推断表里「有估计但不在得分表」的维度（例如某维度答了题但原始分不可算） */
  const inScore = new Set(scoreRows.map(r => r.name));
  const inferExtra = (infer ? infer.rows : []).filter(x => !inScore.has(x.name));

  /* ⚠️ 答题进行中（还没点「看结果」，`S.instResult` 为空）：导出**仍要给估计**——
     用户反馈里「没有具体估计的得分情况」说的正是这件事。此时没有原始分行，
     估计分/置信度照给（硬规则不变：本维度未答 → 不给估计与置信度）。 */
  if (!scoreRows.length && infer) {
    for (const b of infer.rows) {
      const rule = (data.scoring && (data.scoring[b.dim] || {})) || {};
      const state = b.n_answered_own === 0 ? "unanswered"
        : ((b.allowed && b.available) ? "estimated" : "insufficient");
      const est = state === "estimated" ? b.estimate : null;
      const ndEst = (state === "estimated" && hasNorms)
        ? instPercentileDetail(data, b.name, est, REQ_CELL) : null;
      scoreRows.push({
        id: b.dim, name: b.name, value: null,
        n_answered: b.n_answered_own, n_items: b.n_items, complete: false,
        is_domain: false, aggregation: rule.aggregation || "", reverse_items: 0,
        state,
        estimate: est, confidence_r: b.allowed ? b.confidence_r : null,
        estimate_note: state === "unanswered"
          ? "本维度一道题都没答：按硬规则不给估计、置信度与位置"
          : (state === "insufficient"
            ? `已答 ${b.n_answered_own}/${b.n_items} 题，信息量不足（置信度 r=${b.confidence_r == null ? "—" : (+b.confidence_r).toFixed(4)} 未达展示门槛），暂不给估计与位置`
            : ""),
        measured: false,
        pctl: null, pctl_lo: null, pctl_hi: null, T: null, T_lo: null, T_hi: null,
        z: null, mean: null, sd: null, sd_from_mean: null, sd_lo: null, sd_hi: null,
        z_from: "", sd_unavailable_reason: "",
        measured_note: b.n_answered_own === 0
          ? "本维度一道题都没答：没有位置可给"
          : `未答满（${b.n_answered_own}/${b.n_items}）：不用部分作答的原始分查常模`,
        est_pctl: ndEst ? ndEst.pctl : null,
        est_T: ndEst && ndEst.T != null ? ndEst.T : null,
        est_z: ndEst && ndEst.z != null ? ndEst.z
          : (ndEst && ndEst.T != null ? Math.round((ndEst.T - 50) / 10 * 100) / 100 : null),
        est_note: ndEst
          ? `按**估计分**（${(+est).toFixed(2)}）算出的位置：基于已答 ${b.n_answered_own}/${b.n_items} 题、置信度 r=${b.confidence_r == null ? "—" : (+b.confidence_r).toFixed(4)}——**不是实测位置**`
          : "",
        cell: ndEst ? (ndEst.cell || "") : "",
        cell_default: ndEst ? !!ndEst.cell_default : false,
        cell_is_default: ndEst ? !!ndEst.cell_is_default : false,
        cell_fallback: ndEst ? !!ndEst.cell_fallback : false,
        cell_reason: ndEst ? (ndEst.cell_reason || "") : "",
        cell_requested: ndEst ? (ndEst.cell_requested || "") : "",
        default_cell: ndEst ? (ndEst.default_cell || "") : "",
        cell_source: !ndEst ? "" : ((ndEst.cell_reason === "user")
          ? `你填写的分层 ${ndEst.cell}`
          : (ndEst.cell_reason === "fallback")
            ? `回退：你填写的分层 ${ndEst.cell_requested} 在本册不存在 → 用总体层 ${ndEst.cell}`
            : (ndEst.cell_reason === "fallback-norm")
              ? `回退：数据源没有 overall 层 → 取第一层 ${ndEst.cell}`
              : `默认总体层 ${ndEst.cell}（你没填性别与年龄）`),
        n_cells: (nrm && nrm.cells) ? nrm.cells.length : 0,
        extrap: false, facet_id: "", percentile_method: "",
      });
    }
  }

  const judgment = instJudgment(data);
  /* ── 分层参数披露（task-39）：**只写分层码**，不写「女性 / 35–49 岁」这类更直白的表述──
     报告可能被交给第三方，分层码已足够表达，也更不容易被误读成临床信息。 */
  const stratum = (() => {
    const why = stratumUserWhy();
    if (!(hasNorms && nrm && nrm.scales)) {
      return {applicable: false, requested: null, used: "", reason: "", why,
        requested_ok: false, n_cells: 0, default_cell: "", cells: [], note: ""};
    }
    const scId = Object.keys(nrm.scales)[0];
    const rc = resolveNormCell(nrm.scales[scId], nrm, stratumRequestedCell());
    const cells = Array.isArray(nrm.cells) ? nrm.cells.slice() : Object.keys(nrm.scales[scId].cells || {});
    let note;
    if (rc.reason === "user") {
      note = `本报告用**你填写的分层** \`${rc.use}\`（性别 × 年龄，左闭右开）换算百分位与 T 分。`
        + `该参数**只存在本机**、未上传；不填则用总体层。`;
    } else if (rc.reason === "fallback") {
      note = `你填写的信息对应分层 \`${rc.requested}\`，但本册**没有这一层**`
        + `（${why === "under18" ? "数据源没有任何 18 岁以下的分层" : "该 scale 缺这一层"}）`
        + `→ 已**回退到总体层** \`${rc.use}\`，并在此说明原因。`;
    } else if (rc.reason === "fallback-norm") {
      note = `数据源没有总体层 \`overall\` → **回退到第一层** \`${rc.use}\`（如实标注）。`;
    } else {
      note = `你**未填**性别与年龄 → 使用数据源专门提供的**默认总体层** \`${rc.use}\`。`
        + `填了就会用对应分层（该参数只存在本机、未上传）。`;
    }
    return {applicable: true, requested: rc.requested, used: rc.use, reason: rc.reason,
      requested_ok: rc.requested_ok, n_cells: rc.n_cells, default_cell: rc.default_cell,
      cells, why, note};
  })();
  const normNotes = {
    has_norms: hasNorms,
    source: hasNorms ? (nrm.source || "") : "",
    n: hasNorms ? (nrm.n == null ? null : nrm.n) : null,
    n_note: hasNorms ? (nrm.n_note || (data.norms_status && data.norms_status.note) || "") : "",
    percentile_method: hasNorms ? (nrm.percentile_method || "") : "",
    unit: hasNorms ? (nrm.unit || "") : "", domain_unit: hasNorms ? (nrm.domain_unit || "") : "",
    conditional: hasNorms ? !!nrm.conditional : false,
    cells: hasNorms && Array.isArray(nrm.cells) ? nrm.cells.slice() : [],
    scale_range: hasNorms ? (nrm.scale_range || null) : null,
    reverse_transform: hasNorms ? (nrm.reverse_transform || null) : null,
    /* ⚠️ 「为什么没有常模」——**权威原文优先**（打包层已把 `norms.unavailable_reason`
       下发到前端包）；只有数据层没给原文时，才按本册实际口径组装**分册**的说明，
       绝不合成一句通用理由（L2 四册是 T 分型、不是「分界/分带」，混起来会让人以为
       这个量表本来就没有 T 分）。 */
    unavailable_reason: (() => {
      if (hasNorms) return "";
      if (nrm && nrm.unavailable_reason) return String(nrm.unavailable_reason);
      const cr = data.criteria || {};
      if (cr.kind === "t_score") {
        /* Phase 2：表已入档 → 说法必须改成「已接线」，不能再写「尚未取得」 */
        if (cr.tscore_table && Array.isArray(cr.tscore_table.rows) && cr.tscore_table.rows.length) {
          const tt = cr.tscore_table;
          return `本册按 **T 分**判读（${cr.scale || "PROMIS Short Form"}）：`
            + `已入档官方 **raw→T 转换表**`
            + `${tt.form ? `（${tt.form}）` : ""}`
            + `${tt.completeness ? `，${tt.completeness}` : ""}，`
            + `据此给出 **T 分与 SE**（${tt.metric || "M=50, SD=10"}）；`
            + `转换表不是常模百分位表，因此**不给百分位**。`;
        }
        return `本册按 **T 分**判读（${cr.scale || "PROMIS Short Form"}）：`
          + `**手册要求使用 T 分表，但 T 分表尚未取得**`
          + `${cr.source_of_criteria ? `（source_of_criteria=${cr.source_of_criteria}）` : ""}`
          + `${cr.pending_reason ? `。数据层说明（原文）：${cr.pending_reason}` : ""}`;
      }
      if (cr.kind === "cutoff") {
        return `本册的判读口径是**分界值**（cutoff`
          + `${cr.cutoff != null ? ` ≥${cr.cutoff}` : ""}）：按分界判读，`
          + `不提供百分位或 T 分。`;
      }
      if (cr.kind === "severity_bands") {
        return `本册的判读口径是**严重度分带**（severity bands）：`
          + `按分数落在哪个带判读，不提供百分位或 T 分。`;
      }
      if (cr.kind === "per_item") {
        return `本册的判读口径是**逐项判读**（per item，**不计算总分**）：`
          + `各项独立解释，不提供百分位或 T 分。`;
      }
      if ((data.interpretation || {}).kind === "threshold") {
        return "本册按手册设计是**门槛型筛查**（threshold）：手册不提供常模表、"
          + "百分位或 T 分，只提供每个域的门槛。";
      }
      return (data.norms_status && data.norms_status.note) || "（数据层未给出原因）";
    })(),
    unavailable_reason_source: hasNorms ? ""
      : ((nrm && nrm.unavailable_reason)
        ? (((data.norms_status && data.norms_status.file)
          || ("data/norms/" + String((e && e.code) || data.instrument || "").toLowerCase() + ".json"))
          + " 的 unavailable_reason（原文照引）")
        : "按本册 criteria.kind / interpretation.kind 组装（数据层未提供 unavailable_reason 原文）"),
    design_basis: hasNorms ? "" : ((data.interpretation && data.interpretation.kind)
      || (data.criteria && data.criteria.kind) || ""),
    norms_status: data.norms_status || null,
    /* 条件常模的分层使用方式 + **分层敏感度**（数字来自 Lead + confidence-judge 的
       三重独立复核 2026-10-06，不在导出里另行推算） */
    default_layer: (scoreRows.find(r => r.cell) || {}).default_cell || "",
    used_layers: [...new Set(scoreRows.map(r => r.cell).filter(Boolean))],
    fell_back: scoreRows.some(r => r.cell_fallback),
    sensitivity: PID5_LAYER_SENSITIVITY,
  };
  /* 授权标签：**给人类读的 label**，绝不把 `license.kind` 这种内部枚举印到报告里
     （缺陷 4：`copyright_permitted` / `public_domain`）。数据包里的 license 常常只有
     `kind`，人读标签在目录条目（`e.license.label`）里，所以两边合并、label 优先。 */
  const LIC = Object.assign({}, (data.license || {}), (e && e.license) || {});
  if (!LIC.label && (data.license && data.license.label)) LIC.label = data.license.label;
  const LIC_LABEL = LIC.label || "";
  /* 报告时间：本地时间（缺陷 5：`toISOString()` 是 UTC，用户在 Asia/Shanghai 会读到 8 小时前） */
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
    catch (err) { return "本地时区"; } })();
  const localStamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} `
    + `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  return {
    code: e.code, display_name: data.display_name,
    generated_at: now.toISOString(),
    generated_at_local: `${localStamp}（${tz}，本地时间）`,
    answered, total: rows.length,
    response_format: data.response_format,
    license: LIC, license_label: LIC_LABEL,
    citation: data.citation || "",
    score_rows: scoreRows, infer, infer_extra: inferExtra,
    missing_norm_entries: missingNormEntries,
    judgment, norm_notes: normNotes, norm_stratum: stratum,
    items: rows, dim_name: dimName,
  };
}

function instExportMD(data, e) {
  const R = instReport(data, e);
  const fmt = (v, d) => (v == null || v === "" ? "—" : (typeof v === "number" ? (+v).toFixed(d) : v));
  /* task-41：全答满 / 有未答满 —— 决定「估计」那一套列与文案是否出现（函数级，两处都用） */
  const allComplete = R.score_rows.length > 0 && R.score_rows.every(r => r.complete);
  const anyIncomplete = R.score_rows.some(r => !r.complete);
  const rf = R.response_format || {};
  let md = `# ${R.display_name}\n\n`;
  md += `- 量表代码：\`${R.code}\`\n`;
  md += `- 报告生成时间：${R.generated_at_local}（机器可读 UTC：${R.generated_at}）\n`;
  md += `- 已答：${R.answered}/${R.total} 题\n`;
  md += `- 作答范围：${rf.min}–${rf.max}`;
  if (rf.labels && rf.labels.length) {
    md += `（${rf.labels.map((x, i) => `${rf.min + i}=${x}`).join("，")}）`;
  }
  md += "\n";
  md += `- 授权：${R.license_label || "（许可标签未标注）"}`;
  if (R.license.holder) md += `（权利人：${R.license.holder}）`;
  md += "\n";
  if (R.citation) md += `- 引用：${R.citation}\n`;
  md += "\n";

  /* ── 判读（门槛 / 分带 / 逐项 / T 分型）：没有常模的量表走这一段 ── */
  if (R.judgment) {
    const J = R.judgment;
    if (J.kind === "threshold") {
      md += `## 门槛判读（本量表不是常模量表）\n\n`;
      if (J.scoring) md += `计分方式：${J.scoring.replace(/\*\*/g, "")}\n\n`;
      md += `| 域 | 域分 | 门槛 | 判定 | 建议 |\n|---|---|---|---|---|\n`;
      for (const d of J.domains) {
        const sug = d.reached
          ? (d.level2 ? `建议做 ${d.level2.replace("DSM5TR-L2-", "Level 2—")}`
            : (d.domain === "Personality Functioning" ? "建议进一步评估 → PID-5"
              : "建议进一步评估（无对应 Level 2）"))
          : "—";
        const verdict = !d.answered ? "未答"
          : (d.reached ? "达到门槛" : (d.decidable ? "未达到" : "未答完，不能判定"));
        md += `| ${d.domain} | ${d.answered ? d.value.toFixed(0) : "未答"} | `
          + `≥${d.threshold} ${d.threshold_label} | ${verdict} | ${sug} |\n`;
      }
      md += `\n共 ${J.hit} 个域达到门槛。`;
      if (J.domains.some(d => d.answered && !d.reached && !d.complete)) {
        md += `另有域**未答完**：域分取域内最高分，未答的题可能是高分，`
          + `所以未答完时**不能判「未达到」**（只有「已达门槛」是可靠的正向结论）。`;
      }
      if (J.low_threshold_domains.length) {
        md += `注意：${J.low_threshold_domains.join("、")} 这三个域的门槛是 **≥1**`
          + `（比其余更低）——因为漏报的代价高于误报。`;
      }
      md += "\n";
      if (J.pid5_interface) {
        md += `\n**与 PID-5 的衔接**${J.pid5_interface.reached ? "" : "（本域未达门槛）"}：`
          + `「${J.pid5_interface.from_domain}」域没有对应的 Level 2 细评册——`
          + `人格功能的细评工具是 DSM-5 Section III 的 PID-5。`
          + `（接口状态：\`${J.pid5_interface.status}\`）\n`;
      }
      if (J.disclaimer) md += `\n${J.disclaimer.replace(/\*\*/g, "")}\n`;
      md += "\n**本量表没有可用常模**：";
      md += `不提供百分位、T 分或「高于/低于常人」的判断。原因：${
        R.norm_notes.unavailable_reason || "（数据层未给出原因）"}\n\n`;
    } else if (J.kind === "per_item") {
      md += `## 逐项判读（本册不计算总分）\n\n`;
      md += `本册的每一项对应一种不同的物质，应**独立**解释；多项 >0 表示严重度与复杂度更高。\n\n`;
      md += `| 题号 | 项 | 作答 | 是否 >0 |\n|---|---|---|---|\n`;
      for (const x of J.items) {
        md += `| ${x.order} | ${String(x.zh || x.en).replace(/\|/g, "\\|")} | `
          + `${x.value == null ? "未答" : x.value} | ${x.value > 0 ? "是" : (x.value == null ? "—" : "否")} |\n`;
      }
      md += `\n${J.aggregate_label}：${J.value == null ? "—" : J.value}`
        + `（共 ${J.answered} 项已答；>0 的项数 ${J.n_positive}）。`
        + `⚠️ 这不是总分，也不能用来做「严重程度分级」。\n`;
      if (J.notes) md += `\n${J.notes}\n`;
      md += `\n**本量表没有可用常模**：不提供百分位或 T 分。原因：${
        R.norm_notes.unavailable_reason || "（数据层未给出原因）"}\n\n`;
    } else if (J.kind === "severity_bands" || J.kind === "cutoff") {
      md += `## 分带判读\n\n本册是 **${J.scale}**，原始分求和范围 ${(J.sum_range || []).join("–")}。\n\n`;
      md += `| 分数区间 | 判读 | 你的位置 |\n|---|---|---|\n`;
      for (const b of J.bands) {
        md += `| ${b.lo}–${b.hi} | ${b.label} | ${J.band === b.label ? "← 你的分数在此" : ""} |\n`;
      }
      if (J.value != null) {
        md += `\n你的原始分：**${J.value.toFixed(0)}**${J.band ? ` → ${J.band}` : "（不在任何区间内）"}`;
        if (J.cutoff) md += `；分界值 ≥${J.cutoff}`;
        md += "\n";
      }
      if (J.notes) md += `\n${J.notes}\n`;
    } else if (J.kind === "t_score") {
      md += `## T 分型判读\n\n本册是 **${J.scale}**。原始分（范围 ${(J.sum_range || []).join("–")}）`
        + `经 **T 分转换表**换算为 T 分（${/M=50/.test(J.metric || "")
          ? "常模 M=50, SD=10" : (J.metric || "常模 M=50, SD=10")}）。\n\n`;
      const ts = J.tscore;
      if (ts && ts.found) {
        const sd = Math.round((ts.T - 50) / 10 * 100) / 100;
        const dir = sd > 0 ? "高于" : (sd < 0 ? "低于" : "等于");
        md += `- 你的原始分：**${J.value == null ? "—" : J.value.toFixed(0)}**`
          + `（共 ${J.answered} 题已答${J.complete ? "，已答满" : "，**未答满**"}）\n`;
        md += `- **T = ${ts.T.toFixed(1)}**`
          + `${ts.SE != null ? `，**SE = ${ts.SE.toFixed(1)}**` : ""}`
          + `（**查表值**，来自官方 raw→T 转换表，不做内插/外推）；`
          + `即${dir}常模均值 **${Math.abs(sd).toFixed(2)} 个标准差**`
          + `（z 由 T 换算 (T−50)/10）\n`;
        if (J.t_band) md += `- 分带：**${J.t_band}**（T 分单位）\n`;
        /* 分带出处（APA 册子 p.9）与 T 表出处（PROMIS 官方 manual / Anger 例外）**分开写** */
        if (J.bands_meta && J.bands_meta.source) {
          md += `- 分带来源：\`${J.bands_meta.source.file}\``
            + `${J.bands_meta.source.page ? `，p.${J.bands_meta.source.page}` : ""}`
            + `${J.bands_meta.source.section ? `，${J.bands_meta.source.section}` : ""}`
            + `（与上面的 T 转换表**不是同一处**）\n`;
        }
        if (ts.table_title) {
          md += `- 转换表：${ts.table_title}`
            + `${ts.raw_range ? `（raw ${ts.raw_range[0]}–${ts.raw_range[1]}）` : ""}`
            + `${ts.completeness ? `；${ts.completeness}` : ""}\n`;
        }
        if (ts.source) {
          md += `- 转换表来源：\`${ts.source.file}\``
            + `${ts.source.page ? `，p.${ts.source.page}` : ""}`
            + `${ts.source.section ? `，${ts.source.section}` : ""}\n`;
        }
        md += `- 百分位：**不可用**（本册没有常模百分位表；T 分来自官方转换表，不是百分位）\n`;
      } else if (ts && !ts.found) {
        md += `⚠️ **暂不给 T 分**：${ts.reason}\n`;
        if (J.value != null) md += `你的原始分：**${J.value.toFixed(0)}**（共 ${J.answered} 题已答）\n`;
      } else if (!J.tscore_table) {
        md += `⚠️ **目前只给原始分**：本册的 T 分转换表尚未取得，所以不做任何近似换算。\n`;
        if (J.value != null) md += `你的原始分：**${J.value.toFixed(0)}**（共 ${J.answered} 题已答）\n`;
      }
    }
  }

  /* ── 得分总表（常模量表；答题进行中则是「估计表」） ──
     ⚠️ task-41：**按「是否答满」分叉**，不要把「实测」和「估计」混在同一套列里。
     全答满时：不出现「估计分 / 置信度 r / 估计位置」这三列（它们对答满的维度不成立），
     分数列叫「实测得分」，r 改叫「维度信度上限」并写明它不是得分置信度。 */
  if (R.score_rows.length) {
    const rowsN = R.score_rows.length;
    md += S.instResult ? `## 得分总表\n\n` : `## 各维度的目前估计（答题进行中，尚未出结果）\n\n`;
    const COMPLETE_ONLY_NOTE = "不适用：已答满";
    const head = ["维度", "原始分", "已答/题数", "实测得分"];
    /* ⚠️ task-41（Lead 口径）：**答满的维度不逐行显示 r**。
       r 对答满的人来说对所有人都一样（它是问卷的性质，不是这个人的性质），
       逐行摆在每个维度旁边必然被读成「我这个维度的分不可靠」——那正是用户这次的误读机制。
       所以：全答满 → 整个 r 列不出现；有未答满 → 该列只对未答满的行有值。 */
    if (anyIncomplete) head.push("估计分", "置信度 r（仅未答满时）");
    head.push("实测百分位", "实测 T 分", "SE", "实测 z 分", "距均值(SD)", "±1SD 区间", "T 分来源");
    if (anyIncomplete) head.push("估计位置（按估计分）");
    head.push("口径");
    md += "| " + head.join(" | ") + " |\n";
    md += "|" + head.map(() => "---").join("|") + "|\n";
    for (const r of R.score_rows) {
      const sdTxt = (r.sd_lo != null && r.sd_hi != null) ? `[${r.sd_lo}, ${r.sd_hi}]` : "—";
      const estPos = (r.est_pctl != null || r.est_T != null)
        ? `${r.est_pctl == null ? "—" : r.est_pctl + "%ile"}`
          + ` / T ${fmt(r.est_T, 1)} / z ${fmt(r.est_z, 2)}`
        : "—";
      const cells = [r.name, fmt(r.value, 2), `${r.n_answered}/${r.n_items}`,
        r.complete ? fmt(r.value, 2) : "—"];
      if (anyIncomplete) {
        cells.push(r.complete ? COMPLETE_ONLY_NOTE : (r.estimate == null ? "—" : fmt(r.estimate, 2)));
        cells.push(r.complete ? COMPLETE_ONLY_NOTE : fmt(r.confidence_r, 4));
      }
      cells.push(r.pctl == null ? "—" : r.pctl + "%ile",
        fmt(r.T, 1), fmt(r.SE, 1), fmt(r.z, 2), fmt(r.sd_from_mean, 2),
        sdTxt, r.T_source || "—");
      if (anyIncomplete) cells.push(r.complete ? COMPLETE_ONLY_NOTE : estPos);
      cells.push(r.aggregation);
      md += `| ${cells.join(" | ")} |\n`;
    }
    md += `\n- **「实测得分」与「估计分」是两件事**：答满的维度给**实测分**`
      + `（${allComplete ? "本次报告全部答满，所以只有实测得分" : "上表里答满的行"}）；`
      + `只有**未答满**的维度才有「估计分」与「置信度 r」。\n`;
    md += `- **已答满的维度不存在「置信度」**：分数是实测值，没有估计误差；`
      + `「这套题能把这个特质辨到什么程度」是**问卷的性质**，不逐维度列出，`
      + `统一写在下面的「估计与置信度口径」一节。\n`;
    md += `- **实测百分位/T 分/z 分**：只用**答满**该维度的原始分查常模`
      + `（部分作答的均值 ≠ 完整维度得分，两者不可比，因此**不用部分分查表**）。\n`;
    md += `- **L2 的 T 分是「查表值」**：来自官方 raw→T 转换表（` + "`criteria.tscore_table.rows`"
      + `），**不做内插、不做外推**；SE 也来自同一张表。`
      + `\`z\`/\`距均值(SD)\` 是**由 T 换算**（(T−50)/10），与「查表得到的 T」性质不同。\n`;
    if (anyIncomplete) {
      md += `- **估计位置（按估计分）**：只对**未答满**的维度给出：用该维度的**估计分**代入常模算出。`
        + `它**不等于你答满时会得到的分数**，性质与实测位置不同（基于已答 k 题、带置信度 r），`
        + `逐维度细则里写明了说明。\n`;
    }
    md += `\n`;
    if (!R.norm_notes.has_norms) {
      const hasT = R.score_rows.some(r => r.T != null) || (R.judgment && R.judgment.tscore
        && R.judgment.tscore.found);
      md += hasT
        ? `**本册没有常模百分位**（数据层 \`status=unavailable\`）：`
        : `**本量表没有可用常模**：百分位/T 分/z 分/±1SD 均不可用。`;
      md += `${R.norm_notes.unavailable_reason}\n`;
      md += `（原因来源：${R.norm_notes.unavailable_reason_source}）\n\n`;
    }
    /* 逐维度细则 */
    md += `## 逐维度细则\n\n`;
    for (const r of R.score_rows) {
      md += `**${r.name}**\n\n`;
      md += `- 原始分：${fmt(r.value, 2)}（${r.n_answered}/${r.n_items} 题已答`
        + `${r.complete ? "，已答满" : "，**未答满**"}）；计分口径：${r.aggregation || "—"}`
        + `；含反向计分题 ${r.reverse_items} 道（反向题在统计时已折算）\n`;
      /* task-41：**按「是否答满」分叉**。
         答满 → 只有实测分（不存在估计），r 改名「维度信度上限」并写明它不是得分置信度。
         未答满 → 保留「估计分 + 置信度 r」，措辞用「**不等于你答满时会得到的分数**」。 */
      if (r.complete) {
        md += `- **实测得分：${fmt(r.value, 2)}**（${r.n_answered}/${r.n_items} 题已答满）`
          + `——这是**已经测出来的分**，不是估计，不存在估计误差。\n`;
        /* ⚠️ 答满时**不逐行显示那个 r**（Lead 口径）：它是问卷的固有上限，
           对所有人都一样，摆在每个维度旁边只会被读成「我这维的分不可靠」。 */
      } else if (r.estimate != null) {
        md += `- 估计分：**${fmt(r.estimate, 2)}**；置信度 r：${fmt(r.confidence_r, 4)}`
          + `——估计按「本维度已答 ${r.n_answered} 题」的作答向量计算，`
          + `**不等于你答满时会得到的分数**\n`;
      } else {
        md += `- 估计分：—；置信度 r：${r.confidence_r == null ? "—" : fmt(r.confidence_r, 4)}`
          + `${r.state === "insufficient" ? `（已答 ${r.n_answered}/${r.n_items} 题，`
            + `置信度未达展示门槛，暂不给估计与位置——**这不是「未答」**）` : ""}`
          + `${r.state === "partial" ? `（已答 ${r.n_answered}/${r.n_items} 题、未答满；`
            + `本册没有推断模型与常模，不给估计与位置）` : ""}`
          + `${r.state === "unanswered" ? "（本维度一道题都没答）" : ""}\n`;
      }
      if (R.norm_notes.has_norms) {
        if (r.measured) {
          md += `- **实测位置**（用答满的原始分）：百分位 ${r.pctl == null ? "—" : r.pctl + "%ile"}`
            + `${r.pctl_lo != null ? `（95% 区间 ${r.pctl_lo}–${r.pctl_hi}%ile）` : ""}`
            + `；T 分 ${fmt(r.T, 1)}${r.T_lo != null ? `（95% 区间 ${r.T_lo}–${r.T_hi}）` : ""}`;
          if (r.z != null) md += `；z 分 ${fmt(r.z, 2)}（${r.z_from}）`;
          if (r.mean != null && r.sd != null) md += `；常模 mean=${r.mean}、sd=${r.sd}`;
          md += "\n";
        } else {
          md += `- **实测位置：不给**——${r.measured_note}\n`;
        }
        if (r.est_note) md += `- **估计位置**：${r.est_pctl == null ? "—" : r.est_pctl + "%ile"}`
          + `${r.est_T != null ? `、T ${fmt(r.est_T, 1)}` : ""}`
          + `${r.est_z != null ? `、z ${fmt(r.est_z, 2)}` : ""}。${r.est_note}\n`;
        if (r.sd_unavailable_reason) md += `- ⚠️ ±1SD 区间：${r.sd_unavailable_reason}\n`;
        md += `- 常模来源：${R.norm_notes.source}（n=${R.norm_notes.n}）`
          + `；换算方式：${r.percentile_method || R.norm_notes.percentile_method}\n`;
        if (r.cell) {
          md += `- 常模分层：**${r.cell}**（${r.cell_source}；该量表共 ${r.n_cells} 个`
            + `性别×年龄分层）`;
          if (r.cell_reason === "fallback") {
            md += `——⚠️ 你填写的分层 ${r.cell_requested} 在本册**不存在**，已**回退到总体层**`
              + `（原因见下面「常模与参照说明」，导出如实标注）`;
          } else if (r.cell_reason === "fallback-norm") {
            md += `——⚠️ 数据源**没有** overall 总体层，这是**回退**到第一层的结果`
              + `（不是默认总体层，导出如实标注）`;
          } else if (r.cell_reason === "user") {
            md += `——**你填写的**分层（只存在本机、未上传）`;
          } else {
            md += `——**默认总体层**（你未填性别与年龄）`;
          }
          md += `。\n`;
        }
        if (r.extrap) md += `- ⚠️ 该原始分落在常模表的端点之外（extrap=true）：百分位/T 分是端点值，请谨慎解读\n`;
      } else if (r.T != null) {
        /* Phase 2：L2 的 T 分型册子——T/SE 来自**官方 raw→T 查表**（不是常模百分位） */
        const sdT = Math.round((r.T - 50) / 10 * 100) / 100;
        const dir = sdT > 0 ? "高于" : (sdT < 0 ? "低于" : "等于");
        md += `- **T 分（查表值）**：**T = ${fmt(r.T, 1)}**`
          + `${r.SE != null ? `，SE = ${fmt(r.SE, 1)}` : ""}`
          + `（${(r.t_table && r.t_table.metric) || "M=50, SD=10"}），`
          + `即${dir}常模均值 **${Math.abs(sdT).toFixed(2)} 个标准差**`
          + `${r.z != null ? `（z = ${fmt(r.z, 2)}，由 T 换算 (T−50)/10）` : ""}\n`;
        md += `- 百分位：**不可用**——本册没有常模百分位表；T 分来自官方转换表，不是百分位\n`;
        if (r.t_table) {
          md += `- 转换表：${r.t_table.table_title || ""}`
            + `${r.t_table.raw_range ? `（raw ${r.t_table.raw_range[0]}–${r.t_table.raw_range[1]}）` : ""}`
            + `${r.t_table.completeness ? `；${r.t_table.completeness}` : ""}\n`;
          if (r.t_table.source) {
            md += `- 转换表来源：\`${r.t_table.source.file}\``
              + `${r.t_table.source.page ? `，p.${r.t_table.source.page}` : ""}`
              + `${r.t_table.source.section ? `，${r.t_table.source.section}` : ""}\n`;
          }
        }
        if (r.sd_unavailable_reason) md += `- ⚠️ ±1SD 区间：${r.sd_unavailable_reason}\n`;
      } else if (r.T_reason) {
        md += `- **T 分：不给**——${r.T_reason}\n`;
      } else {
        md += `- 常模位置：**不可用**（本册没有可用常模`;
        md += R.norm_notes.design_basis === "threshold"
          ? `：门槛型筛查，手册按设计不提供常模表/百分位/T 分）\n`
          : `）。原因：${R.norm_notes.unavailable_reason || "（数据层未给出原因）"}\n`;
      }
      if (r.is_domain) md += `- 本行是**域分**（由若干面向聚合而成，见 `+"`scoring`"+` 的 of 列表）\n`;
    }
    md += "\n";
    /* 「未答维度」：判据**只能**是 n_answered === 0（缺陷 1/2 的修正） */
    const unanswered = R.score_rows.filter(r => r.n_answered === 0)
      .concat((R.infer ? R.infer.rows.filter(x => x.n_answered_own === 0
        && !R.score_rows.some(r => r.name === x.name)) : [])
        .map(x => ({name: x.name, n_answered: 0, n_items: x.n_items})));
    if (unanswered.length) {
      md += `## 未答维度（一题都没答）\n\n`;
      md += `| 维度 | 已答/题数 | 说明 |\n|---|---|---|\n`;
      for (const b of unanswered) {
        md += `| ${b.name} | ${b.n_answered}/${b.n_items} | 本维度一道题都没答：`
          + `按硬规则不给估计、置信度与位置（与别的维度答了多少无关） |\n`;
      }
      md += "\n";
    }
    /* 「答了但**未答满**、信息量不足」：**与「一题未答」「已答满」都分开写**。
       ⚠️ task-41：判据必须排除**已答满**的维度——领域分（23/23 等）已经答满、
       实测位置也给了，却曾被列进这张表，标题与内容直接矛盾。 */
    const notEnough = R.score_rows.filter(r => r.state === "insufficient" && !r.complete);
    if (notEnough.length) {
      md += `## 已作答但**未答满**、信息量不足（暂不给估计与位置）\n\n`;
      md += `（判据：这一维**还没答满**，且当前作答组合的置信度未达展示门槛；`
        + `**已答满的维度不在此列**——它们给的是实测分与实测位置。）\n\n`;
      md += `| 维度 | 已答/题数 | 置信度 r | 说明 |\n|---|---|---|---|\n`;
      for (const r of notEnough) {
        md += `| ${r.name} | ${r.n_answered}/${r.n_items} | ${fmt(r.confidence_r, 4)} | `
          + `已答题但未答满，且置信度未达展示门槛（\`conf_r ≥ dim_ceiling × ceiling_ratio\`），`
          + `因此不给估计与位置——**这不是「未答」** |\n`;
      }
      md += "\n";
    }
    /* 没有推断模型的册子：未答满的维度单独说明（不套用「置信度门槛」文案） */
    const partial = R.score_rows.filter(r => r.state === "partial");
    if (partial.length) {
      md += `## 未答满的维度\n\n`;
      md += `| 维度 | 已答/题数 | 说明 |\n|---|---|---|\n`;
      for (const r of partial) {
        md += `| ${r.name} | ${r.n_answered}/${r.n_items} | 已答题但未答满：`
          + `本册**没有推断模型与常模**，因此不给估计、置信度与百分位；`
          + `判读以上面的门槛/分带表为准 |\n`;
      }
      md += "\n";
    }
    /* 答满却没有常模条目：另一类问题，单独列出（并报告 Lead） */
    if (R.missing_norm_entries.length) {
      md += `## 答满但常模表里没有对应条目\n\n`;
      md += `以下维度**已答满**，但这套常模里找不到对应条目，所以给不出位置：`
        + `${R.missing_norm_entries.join("、")}。（这属于「常模覆盖缺口」，不是部分作答问题。）\n\n`;
    }
    if (R.infer) {
      /* 维度计数：**必须与表格行数自洽**（task-41）——面向（有推断模型）+ 领域，
         答满 / 未答满分开数，别再出现「25 个维度」后面跟着 5 行"未达门槛"的表。 */
      const nRows = R.score_rows.length;
      const nFacet = R.infer.rows.length;
      const nDomain = Math.max(0, nRows - nFacet);
      const nComplete = R.score_rows.filter(r => r.complete).length;
      const nIncomplete = nRows - nComplete;
      const nIncompleteEst = R.score_rows.filter(r => !r.complete && r.estimate != null).length;
      const nIncompleteBlocked = nIncomplete - nIncompleteEst;
      md += `## 估计与置信度口径\n\n`;
      md += `- 估计分来自 \`ui/lib/inference.js\`（唯一推断实现）：以「已答的题目＋作答值」为条件`
        + `的线性预测${R.infer.model ? `（模型：\`${R.infer.model}\`）` : ""}。`
        + `**只有未答满的维度才有估计分**；答满的维度给的是实测分。\n`;
      /* ⚠️ 这一句是 **confidence-judge 定稿**（照抄，不改写成更技术的说法） */
      md += `- **\`r\` 的口径**：${CONF_R_DEF_TEXT}\n`;
      /* 本量表的实际可辨上限区间：优先用本次导出里**已答满**面向的 r 现算
         （答满时 r == 该特质的可辨上限，逐位相同，Lead + confidence-judge 已核）；
         抽样不足以定范围时退回 judge 给的经验区间。 */
      const ceilVals = R.score_rows.filter(r => r.complete && r.ceiling_r != null)
        .map(r => r.ceiling_r);
      const ceilTxt = ceilVals.length >= 5
        ? `${Math.min(...ceilVals).toFixed(2)}–${Math.max(...ceilVals).toFixed(2)}`
          + `（${ceilVals.length} 个面向，按本次导出实测）`
        : CONF_R_CEILING_RANGE_FALLBACK;
      md += `- 本量表**各特质的可辨上限**：${ceilTxt}。它**对所有人都一样**——`
        + `同一套题、同样的已答集合，不管你把题答成 0 还是 3，这个 r 都不变；`
        + `它是**这张问卷的性质**，不是**你这个人的性质**。\n`;
      md += `- 给估计与位置的门槛（**只对未答满的维度生效**）：只答了一部分时，`
        + `要求 r 达到该特质**可辨上限的九成**才给估计与位置；未达标就只给能给的实测位置。\n`;
      md += `- **硬规则**：本维度一道题都没答 → 不出估计、不出置信度。\n`;
      md += `- **维度计数（与上面的表逐行对得上）**：本次报告共 **${nRows}** 个维度`
        + `（${nFacet} 个面向 + ${nDomain} 个领域）；其中**已答满 ${nComplete} 个**`
        + `（直接给实测分与实测位置，**不需要估计、也不逐行列置信度**）、`
        + `**未答满 ${nIncomplete} 个**`
        + `（其中给估计 ${nIncompleteEst} 个、因未达门槛不给估计 ${nIncompleteBlocked} 个）。\n`;
      if (R.infer.n_total && R.infer.n_total !== nFacet) {
        md += `- 推断模型覆盖 ${nFacet} 个面向（领域分不做推断）：可给估计 `
          + `${R.infer.n_ready}/${nFacet}、已达可展示门槛 ${R.infer.n_allowed}/${nFacet}。\n`;
      }
      if (R.infer.layer_note) md += `- 分层口径：${String(R.infer.layer_note).replace(/\*\*/g, "")}\n`;
      md += allComplete
        ? `\n**声明**：本次报告**所有维度都已答满**，给出的都是**实测分**（不是估计），`
          + `不存在估计误差；上面那个 r 是**这套题对各项特质的可辨上限**，`
          + `**不是**你这次得分的可信程度。\n\n`
        : `\n**声明**：估计分**不是已经测出来的得分**，只是以已答信息为条件的最优猜测，`
          + `**不等于你答满时会得到的分数**；答满的维度一律以实测分为准。\n\n`;
    }
  }

  /* ── 常模与参照说明 ── */
  md += `## 常模与参照说明\n\n`;
  if (R.norm_notes.has_norms) {
    md += `- 常模来源：${R.norm_notes.source}；样本量 n=${R.norm_notes.n}\n`;
    if (R.norm_notes.n_note) md += `- 样本说明（照抄数据层原文）：${R.norm_notes.n_note}\n`;
    md += `- 单位：${R.norm_notes.unit || "—"}`
      + `${R.norm_notes.domain_unit ? `（域分单位：${R.norm_notes.domain_unit}）` : ""}\n`;
    md += `- 百分位换算方式：${R.norm_notes.percentile_method || "—"}\n`;
    if (R.norm_stratum && R.norm_stratum.applicable && R.norm_notes.cells.length) {
      const S2 = R.norm_notes.sensitivity || {};
      const ST = R.norm_stratum || {};
      md += `- 这是**条件常模**（按性别×年龄分层）：共 ${R.norm_notes.cells.length} 个分层 —— `
        + `${R.norm_notes.cells.join("、")}。\n`;
      /* task-39：**只写分层码**（写「女性/35–49 岁」更直白、也更易被误读成临床信息） */
      md += `- **本次实际使用的分层：\`${ST.used || R.norm_notes.default_layer || "overall"}\`**`;
      if (ST.reason === "user") {
        md += `（**你填写的**分层；该参数只存在本机、未上传）`;
      } else if (ST.reason === "fallback") {
        md += ` —— ⚠️ 你填写的信息对应分层 \`${ST.requested}\`，但本册**没有这一层**`;
        md += ST.why === "under18"
          ? `（数据源**没有任何 18 岁以下**的分层）` : `（该 scale 缺这一层）`;
        md += `，因此**回退到总体层** \`${ST.used}\`。`;
      } else if (ST.reason === "fallback-norm") {
        md += ` —— ⚠️ 数据源缺少 \`overall\` 总体层，**回退到第一层**（不是默认总体层）。`;
      } else {
        md += `（**默认总体层**：你未填性别与年龄；填了就会用对应分层）`;
      }
      md += `\n`;
      if (ST.note) md += `- 分层说明：${ST.note}\n`;
      md += `- **分层敏感度**（同一原始分在不同性别×年龄分层下的百分位差别，`
        + `来源：\`${S2.verified_by || "复核"}\`）：9 个分层之间**全局最大跨度 `
        + `约 ${S2.max_span_pp} 个百分点**（例：${S2.max_span_example}）；`
        + `若像旧版本那样恒定使用第一层 \`f [18,35)\`，相对真实分层**最大偏差约 `
        + `${S2.first_cell_max_dev_pp} 个百分点**（例：${S2.first_cell_example}）——`
        + `同一份作答可能被读成「偏低」或「明显偏高」，结论会反过来。\n`;
      /* task-41：删掉「本工具当前**不采集**」——性别年龄输入已上线（task-39），
         那句话与上面的「本次实际使用的分层 = 你填写的」直接冲突。 */
      md += `- 分层参数：可在 PID-5 的作答页/结果页选择**性别与年龄**（**可选、只存本机、`
        + `可随时清除**；不填则用数据源的总体层）。本次实际使用的分层见上：`
        + `\`${ST.used || "overall"}\`。\n`;
    }
    if (R.norm_notes.scale_range) md += `- 量表分数范围：${JSON.stringify(R.norm_notes.scale_range)}\n`;
    if (R.norm_notes.reverse_transform) md += `- 反向计分折算：${JSON.stringify(R.norm_notes.reverse_transform)}\n`;
  } else {
    /* 无常模：**照引数据层的权威原文**（打包层已下发 `norms.unavailable_reason`）；
       没有原文时按本册实际 criteria.kind 分册说明（不合成通用理由）。
       ⚠️ L2 的 T 分型册子**有 T 分**（来自官方转换表），只是没有百分位常模——
       不能写成「不给 T 分」。 */
    const hasT2 = R.score_rows.some(r => r.T != null)
      || (R.judgment && R.judgment.tscore && R.judgment.tscore.found);
    md += hasT2
      ? `- **本册没有常模百分位**（数据层 \`status=unavailable\`）：**T 分来自官方 raw→T 转换表**`
        + `（见上「T 分型判读」），不是百分位。原因：${R.norm_notes.unavailable_reason}\n`
      : `- **本量表没有可用常模**（数据层 \`status=unavailable\`）：不给百分位/T 分。`
        + `原因：${R.norm_notes.unavailable_reason}\n`;
    md += `- 原因来源：${R.norm_notes.unavailable_reason_source}\n`;
    if (data.norms_status && data.norms_status.note) {
      md += `- 数据层运行时说明：${data.norms_status.note}\n`;
    }
  }
  md += "\n";

  /* ── 逐题作答 ── */
  md += `## 逐题作答\n\n| 题号 | 维度 | 你的作答 | 中文题面 |\n|---|---|---|---|\n`;
  for (const r of R.items) {
    const d = r.dim.split("|").map(x => R.dim_name.get(x) || x).join("、");
    const v = r.value === "" ? "（未答）" : r.value;
    md += `| ${r.order} | ${d} | ${v} | ${String(r.zh || r.en).replace(/\|/g, "\\|")} |\n`;
  }
  md += `\n## 授权与引用\n\n- 授权：${R.license_label || "（许可标签未标注）"}`;
  if (R.license.holder) md += `（权利人：${R.license.holder}）`;
  md += "\n";
  if (R.license.notes) md += `- 许可说明：${R.license.notes}\n`;
  if (R.citation) md += `- 引用：${R.citation}\n`;
  md += `\n## 免责声明\n\n本报告由 **EmoHealth · 人格与心理测量自查工具** 生成，`
    + `只含「${R.code}」这一套量表的作答，**不构成诊断**，也不能替代专业人员评估。`
    + `估计分是统计推断结果，不是已经测出来的得分。\n`;
  download(`${e.code}-报告-${stamp()}.md`, md, "text/markdown");
}

function instExportResultCSV(data, e) {
  if (!S.instResult) return;
  const R = instReport(data, e);
  /* ⚠️ task-41：`估计分`/`置信度r` **只对未答满的维度有效**（答满的行留空，
     它们给的是**实测分**）；答满时那个 r 的真名是「维度信度上限」（单独一列）。 */
  const head = ["维度", "状态", "原始分", "估计分", "置信度r", "维度信度上限", "估计说明",
    "实测百分位", "实测百分位95下限", "实测百分位95上限",
    "实测T分", "实测T分95下限", "实测T分95上限", "SE", "T分来源", "T分不可用原因", "T分带", "分带来源", "转换表", "转换表来源",
    "实测z分", "z分来源", "常模均值", "常模标准差", "距均值SD数",
    "1SD下限", "1SD上限", "±1SD不可用原因", "实测位置说明",
    "估计位置百分位", "估计位置T分", "估计位置z分", "估计位置说明",
    "常模分层", "分层来源", "分层是否默认", "分层是否回退", "分层数", "外推",
    "已答", "题数", "答完", "是否域", "计分口径", "反向题数",
    "常模来源", "常模样本量", "百分位换算方式", "无可用常模原因"];
  const esc2 = v => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  /* 用列名定位（不用硬编码下标：列一多就会错位，且 `extra` 行的下标也会漂） */
  const idx = k => head.indexOf(k);
  const rows = R.score_rows.map(r => {
    const a = new Array(head.length).fill("");
    const set = (k, v) => { a[idx(k)] = (v == null ? "" : v); };
    set("维度", r.name);
    set("状态", r.state === "unanswered" ? "未答（一题未答）"
      : (r.complete ? "已答满（实测分）"
        : (r.state === "insufficient" ? "已答但未答满、信息量不足"
          : (r.state === "estimated" ? "未答满（按估计分给位置）"
            : "已答但未答满"))));
    set("原始分", r.value == null ? "" : r.value);
    /* 答满的维度：估计分/置信度r **留空**（不存在估计）；它的 r 进「维度信度上限」列 */
    set("估计分", (!r.complete && r.estimate != null) ? r.estimate : "");
    set("置信度r", (!r.complete && r.confidence_r != null) ? r.confidence_r : "");
    set("维度信度上限", r.complete && r.ceiling_r != null
      ? Math.round(r.ceiling_r * 10000) / 10000 : "");
    set("估计说明", r.complete
      ? "已答满：这一行的分数是**实测分**，不存在估计（估计分/置信度 r 不适用）；"
        + "「维度信度上限」是题目分辨能力上限，不是得分置信度"
      : r.estimate_note);
    set("实测百分位", r.pctl == null ? "" : r.pctl);
    set("实测百分位95下限", r.pctl_lo == null ? "" : r.pctl_lo);
    set("实测百分位95上限", r.pctl_hi == null ? "" : r.pctl_hi);
    set("实测T分", r.T == null ? "" : r.T);
    set("SE", r.SE == null ? "" : r.SE);
    set("T分来源", r.T_source || "");
    set("T分不可用原因", r.T_reason || "");
    set("T分带", (R.judgment && R.judgment.t_band) || "");
    set("分带来源", (R.judgment && R.judgment.bands_meta && R.judgment.bands_meta.source)
      ? [R.judgment.bands_meta.source.file,
        R.judgment.bands_meta.source.page ? "p." + R.judgment.bands_meta.source.page : ""]
        .filter(Boolean).join("；") : "");
    set("转换表", r.t_table ? (r.t_table.table_title || r.t_table.form || "") : "");
    set("转换表来源", (r.t_table && r.t_table.source)
      ? [r.t_table.source.file, r.t_table.source.page ? "p." + r.t_table.source.page : "",
        r.t_table.source.section || ""].filter(Boolean).join("；") : "");
    set("实测T分95下限", r.T_lo == null ? "" : r.T_lo);
    set("实测T分95上限", r.T_hi == null ? "" : r.T_hi);
    set("实测z分", r.z == null ? "" : r.z);
    set("z分来源", r.z_from);
    set("常模均值", r.mean == null ? "" : r.mean);
    set("常模标准差", r.sd == null ? "" : r.sd);
    set("距均值SD数", r.sd_from_mean == null ? "" : r.sd_from_mean);
    set("1SD下限", r.sd_lo == null ? "" : r.sd_lo);
    set("1SD上限", r.sd_hi == null ? "" : r.sd_hi);
    set("±1SD不可用原因", r.sd_unavailable_reason);
    set("实测位置说明", r.measured_note);
    set("估计位置百分位", r.est_pctl == null ? "" : r.est_pctl);
    set("估计位置T分", r.est_T == null ? "" : r.est_T);
    set("估计位置z分", r.est_z == null ? "" : r.est_z);
    set("估计位置说明", r.est_note);
    set("常模分层", r.cell);
    set("分层来源", r.cell_source);
    set("分层是否默认", r.cell ? (r.cell_is_default ? "是" : "否") : "");
    set("分层是否回退", r.cell ? (r.cell_fallback ? "是" : "否") : "");
    set("分层数", r.n_cells || "");
    set("外推", R.norm_notes.has_norms ? (r.extrap ? "是" : "否") : "");
    set("已答", r.n_answered);
    set("题数", r.n_items);
    set("答完", r.complete ? "是" : "否");
    set("是否域", r.is_domain ? "是" : "否");
    set("计分口径", r.aggregation);
    set("反向题数", r.reverse_items);
    if (R.norm_notes.has_norms) {
      set("常模来源", R.norm_notes.source || "");
      set("常模样本量", R.norm_notes.n == null ? "" : R.norm_notes.n);
      set("百分位换算方式", r.percentile_method || R.norm_notes.percentile_method || "");
    } else {
      set("无可用常模原因", R.norm_notes.unavailable_reason || "");
    }
    return a;
  });
  /* 未答维度也出一行（估计/置信度留空），让「硬规则」在明细里可见 */
  const extra = (R.infer ? R.infer.rows.filter(x => !x.allowed) : []).map(x => {
    const a = new Array(head.length).fill("");
    a[idx("维度")] = x.name;
    const zero = x.n_answered_own === 0;
    a[idx("状态")] = zero ? "未答（一题未答）" : "已答但信息量不足";
    a[idx("估计说明")] = zero
      ? "本维度一道题都没答：按硬规则不给估计、置信度与位置"
      : `已答 ${x.n_answered_own}/${x.n_items} 题，信息量不足（置信度 r=${
        x.confidence_r == null ? "—" : (+x.confidence_r).toFixed(4)} 未达展示门槛），`
        + `暂不给估计与位置——**这不是「未答」**`;
    a[idx("已答")] = x.n_answered_own;
    a[idx("题数")] = x.n_items;
    a[idx("答完")] = "否";
    if (!R.norm_notes.has_norms) {
      a[idx("无可用常模原因")] = R.norm_notes.design_basis === "threshold"
        ? "本册是门槛型筛查：手册按设计不提供常模表/百分位/T 分（不是「没找到」）"
        : "本册没有可用常模（判读依据是分界/分带/逐项判据）";
    }
    return a;
  });
  const csv = "\ufeff" + [head, ...rows, ...extra].map(r => r.map(esc2).join(",")).join("\r\n");
  download(`${e.code}-结果-${stamp()}.csv`, csv, "text/csv");
}
/* 该量表可用的作答方式：天赋树（> 60 题且已有布局数据）+ 经典逐题。
   ⚠️ 上一版还有「分级模式」「情景模式」两种置信度驱动的界面，已按用户要求撤下；
   这里**如实**反映现有能力，不列点了没反应的入口。 */
function instModes(code, itemCount) {
  const out = [];
  if (itemCount > TREE_MIN_ITEMS && treeAvailable(code, itemCount)) {
    out.push({id: "tree", label: "天赋树", sub: "按维度成簇的布局，挑着答"});
  }
  out.push({id: "classic", label: "经典逐题",
            sub: `共 ${Math.ceil(itemCount / INST_PER_PAGE)} 页`});
  return out;
}
/* ── 子页：作答方式切换条 ──────────────────────────────────
   这是**子页内部**的控制，不是顶层模式（顶层那排只是快捷入口）。 */
function instModeBar(code, itemCount) {
  const modes = instModes(code, itemCount);
  if (modes.length < 2) return "";
  const cur = S.instView === "paged" ? "classic" : S.instView;
  let h = `<div class="viewswitch">`;
  for (const m of modes) {
    h += m.id === cur
      ? `<button class="on" disabled>${esc(m.label)}
           <span class="sub">${esc(m.sub)}</span></button>`
      : `<button data-instmode="${m.id}">${esc(m.label)}
           <span class="sub">${esc(m.sub)}</span></button>`;
  }
  return h + `</div>`;
}

/* ══ 题面四字段的渲染（经典逐题与天赋树就地作答**共用**）══════════════════
   数据源：`ui/items-structured/<code>.js`（结构化，权威）＋ 量表包（回退）。
   四部分**并列且可区分**，不是混排：
     · `.insttext` 中译（主体，data-f="text_zh"）
     · `.insten`   英文原文（data-f="text_en"）
     · `.opt .om`  选项情景说明 meaning_zh（data-f="meaning_zh"）——**选之前就可见**

   每一项的来源都可展开查证（`<details class="srcfold">`）：IPIP-NEO 的 1500 条

const BASIS_ZH = {

  manual_labels: "手册锚点标签",
  manual_verbatim: "手册原文逐字",
};
function basisZh(b) { return BASIS_ZH[b] || b || ""; }

/* 每题不再有「依据/出处」折叠（D120 / task-24）。
   原来每题都会渲染一行来源字符串（`text_zh_source` / `text_source` / 每条提醒的
   `source`），例如「data/text-db/text-db.json（zh_source: AI 逐条复核 + 仲裁）」或
   手册 PDF 的评分段落引用——那是**给审阅者核对的内部字段**，
   用户读了不会改变作答或理解。数据仍在 `data/items-structured/*.js` 里，
   可溯源由**数据层 + 文档层**承担；界面不承担。 */
function itemBasisHtml() { return ""; }

/* 题面（中译主体 + 原文并列 + 情景块 + 作答注记）。
   ⚠️ schema 2.1（task-32）：每题**必填** `scenario_zh`（一句情景展示，20–60 汉字）——
   它是「帮你理解这句话在什么场景下成立」的**答题必需**信息，所以
   **默认可见、不做折叠**，且在视觉上与题干区分（`.scene`：细色条 + 次级墨色 + 略小字号；
   用的不是品牌色——品牌色是提醒用的）。
   ⚠️ `text_en_verbatim` / `text_en_repairs` 是**内部字段**（排版修复留痕），绝不上界面。
   ⚠️ `notes_zh` 现在可能**不出现或为空数组**，这里已按 `|| []` 处理。 */
function itemStemHtml(it, st) {
  const zh = (st && st.text_zh) || it.zh || it.text || "";
  const en = (st && st.text_en) || it.text || "";
  let h = `<div class="insttext" data-f="text_zh">${esc(zh)}</div>`;
  if (en && en !== zh) {
    h += `<div class="insten" data-f="text_en"><span class="entag">EN</span>${esc(en)}</div>`;
  }
  /* 情景块：紧接题干之后、作答注记之前；纯展示，不参与计分/推断/导出 */
  const scene = (st && typeof st.scenario_zh === "string") ? st.scenario_zh.trim() : "";
  if (scene) {
    h += `<div class="scene" data-f="scenario_zh">${md(scene)}</div>`;
  }
  const notes = (st && st.notes_zh) || [];
  if (notes.length) {
    h += `<ul class="instnotes" data-f="notes_zh">`;
    for (const n of notes) h += `<li>${md(n.text || "")}</li>`;
    h += `</ul>`;
  }
  /* ⛔️ 这里**故意没有** `it.note` 的回退（task-40）。
     `it.note` 是**译者备忘**（「测快感缺失：…」「原文 enjoylife 为排版噪声…」），
     PID-5 只有 15/220 题有「情景提醒」，删掉提醒后**其余约 205 题会回落到备忘**，
     把开发者文案显示给用户——违反 D120 的用户裁决。
     正确做法是**不发、不渲染**，而不是去判断哪条备忘「读起来还可以」。
     用户可见注记只有两个来源：`scenario_zh`（情景，见上）与 `notes_zh`（作答注记，
     来自 `content/scenes/*.json`，606 题全覆盖）。`it.note` 同时也不进任何导出文件。 */
  return h;
}

/* ══ 三档提醒的分级显示（D119 / schema 2.0）═════════════════════════════════

   用户点名的第一件事：**不要在每个选项里重复同一句注释**。数据层（task-22）已把说明
   分成三级，界面按级**各说一次**：

     · **量表级**（`instrument_guide`）：作答指示、时间窗、量表性质、非诊断声明、
       按维度的敏感提示、反向计分说明 —— 每个量表/册渲染**一次**（作答区顶部）。
     · **锚点级**（`scale_guides[scale_id]`）：这把尺子的共同说明
       （`anchor_note_zh`）＋「没有统一标准、凭你自己判断」那句
       （`quantification_note_zh`）—— **每组尺子渲染一次**：同一把尺子连续 10 题
       只出现 1 次；换到另一把尺子（如 IPIP 换 facet）才出现新的一份。
     · **选项级**（`scale_guides[*].options[].meaning_zh`，逐题锚点则在题上）：
       就地写在该选项里，**不再重复**上面两级的句子。

   ⚠️ 内部字段（`source` / `label_source` / `options_source` / `*_source`）一律不上界面。 */
function instrumentGuideHtml(code) {
  const d = structPayload(code);
  const g = (d && d.instrument_guide) || null;
  const first = (d && d.items && d.items.length) ? d.items[0] : null;
  const r = (first && first.response) || {};
  const instr = (g && g.instruction_zh) || r.question_head_zh || "";
  const tf = (g && g.time_frame_zh) || r.time_frame_zh || "";
  const what = (g && g.what_it_is_zh) || "";
  const nondiag = (g && g.non_diagnostic_notice_zh) || "";
  const rev = (g && g.reverse_keyed_note_zh) || "";
  const topics = (g && g.topic_notices && typeof g.topic_notices === "object")
    ? Object.keys(g.topic_notices).map(k => g.topic_notices[k]).filter(t => t && t.text) : [];
  if (!instr && !tf && !what && !nondiag && !rev && !topics.length) return "";
  let h = `<div class="instrhead" data-guide="instrument" data-code="${esc(code)}">`;
  if (instr) h += `<b data-guide-part="instruction">${md(instr)}</b>`;
  if (tf) h += `<span class="note" data-guide-part="time_frame">时间窗：${esc(tf)}</span>`;
  if (what) h += `<div class="note">${md(what)}</div>`;
  if (rev) h += `<div class="note" data-guide-part="reverse">${md(rev)}</div>`;
  for (const t of topics) {
    h += `<div class="note topicnote" data-guide-part="topic">${
      t.topic ? `<b>${esc(t.topic)}</b>：` : ""}${md(t.text || "")}</div>`;
  }
  if (nondiag) h += `<div class="note" data-guide-part="non_diagnostic">${md(nondiag)}</div>`;
  return h + `</div>`;
}
function anchorGuideHtml(code, scaleId) {
  const g = scaleGuideOf(code, scaleId);
  if (!g) return "";
  const note = g.anchor_note_zh || "";
  const quant = g.quantification_note_zh || "";
  if (!note && !quant) return "";
  return `<div class="anchorguide" data-guide="anchor" data-scale-id="${esc(scaleId || "")}${
    g.scale_id && g.scale_id !== scaleId ? "" : ""}">
    ${g.label ? `<span class="aglabel">${esc(g.label)}</span>` : ""}${
    note ? `<div class="agnote" data-guide-part="anchor_note">${md(note)}</div>` : ""}${
    quant ? `<div class="agnote agquant" data-guide-part="quantification_note">${md(quant)}</div>` : ""}
  </div>`;
}

/* 选项：中英标签 + **情景说明就地可见**（选项级语义，不含上级句子）。
   ⚠️ `.opt` 必须仍是 `<button>`、`.ot` 必须仍是「整句陈述/标签原文」——
   `tools/check/test_mania_options_ui.js` 钉住这两条读取路径。
   ⚠️ 不要在 `<button>` 里放 `<details>`（交互元素嵌套非法、点击会被吞）。
   标签来源（schema 2.0）：`items[].response.options[]`（逐题锚点如 ASRM/FOCI 的陈述
   也在题上）；选项语义：`scale_guides[scale_id].options[].meaning_zh`（有则优先）。 */
function itemOptionsHtml(it, st, rf, cur, extraAttr) {
  const code = S.instCode;

  const guide = scaleGuideOf(code, sid);
  const gOpts = new Map(((guide && guide.options) || []).map(o => [+o.v, o]));
  const vList = own ? own.map(o => +o.v) : (() => {
    const out = [];
    for (let v = rf.min; v <= rf.max; v++) out.push(v);
    return out;
  })();
  const long = vList.some(v => {
    const g = gOpts.get(v) || {}, o = byV.get(v) || {};
    const ownOpt = own ? own.find(x => +x.v === v) : null;
    const t = (ownOpt && ownOpt.text) || o.label_zh || g.label_zh || o.label_en || "";
    return String(t).length > 18 || !!(byV.get(v) || gOpts.get(v));
  });
  let h = `<div class="opts ${long ? "longopts" : "inlinopts"}">`;
  for (const v of vList) {
    const o = byV.get(v) || {};
    const g = gOpts.get(v) || {};
    const ownOpt = own ? own.find(x => +x.v === v) : null;
    const ot = (ownOpt && ownOpt.text) || g.label_en || o.label_en || "";
    const oz = o.label_zh || g.label_zh || "";
    const meaning = g.meaning_zh || o.meaning_zh || "";
    h += `<button class="opt${cur === v ? " sel" : ""}" data-v="${v}"${
      extraAttr ? " " + extraAttr : ""}>
      <span class="k">${v}</span><span class="ol">${
      ot ? `<span class="ot" data-f="opt_label_en">${esc(ot)}</span>` : ""}${
      oz ? `<span class="oz" data-f="opt_label_zh">${esc(oz)}</span>` : ""}${
      meaning ? `<span class="om" data-f="meaning_zh">${md(meaning)}</span>` : ""}</span>
    </button>`;
  }
  return h + `</div>`;
}

/* ══ 各指标的预测 + 置信度（用 ui/lib/inference.js，**不重写算法**）══════════

   数据流：按需注入 `ui/lib/inference.js`（纯函数）＋ `ui/inference/<code>.js`
   （engine 生成的参数包：`params` + `pairB64`）→ `predictFrom(payload, S.instResp)`。

   三条硬规则（用户明确要求，逐条落到实处）：
    ① **本维度一道题都没答 → 不展示该维度的预测与置信度**（`display_allowed=false`，
       原因是 `NO_OWN_ITEM_ANSWERED`）。**不得**因为别的维度答得多就放行——
       该行里连 r 都不出现，只写原因。
    ② **严格分层**：官方分（量表声明口径，**缺失不猜**）与推断值分开两列，
       推断值一律带 `inferred=true` 标记与「推断」徽章，绝不混算。
    ③ 置信度不足门槛（`conf_r ≥ dim_ceiling × ceiling_ratio`）时**不给预测数**，
       只给 r 与「已达上限 X%」；文案不让推断值看起来像已经测准的分数。
   注意区分两个「上限」：门控分母是**本维度**的 `dim_ceiling × ceiling_ratio`，
   而「已达上限 X%」的显示分母是**跨维度**上限 `dim_ceiling_cross`
   （避免出现「已达上限 120%」这种荒谬读数的正是后者；`ceiling_pct` 由
   `ui/lib/inference.js` 按 `conf_r ÷ dim_ceiling_cross` 直接算好，已夹在 [0,1]）。 */
let _PRED = {key: null, res: null};      // 同一份作答只算一次（作答版本号做键）

function dimNameOf(params, dim) {
  return (params.dim_name && params.dim_name[dim]) || dim;
}

/* ══ 用户语言（D118）：把 conf_r / 门槛翻译成「能懂的分级」 ══════════════

   用户需要知道「现在这个结果可不可信」，但**不需要**知道 `r=0.7132`、
   门槛 `0.8132`、`ceiling_ratio=0.90`。所以默认视野里只给分级；
   精确值、门槛、口径全部收进「依据与出处」折叠（R1：仍可查，只是不默认显示）。

   ⚠️ 分级**只用于显示**：判据永远是库给的 `b.available`（= conf_r ≥ dim_ceiling×ratio），
   这里不对任何数字做第二次判定。 */
function confLevel(b) {
  if (!b || !b.display_allowed) return {key: "none", zh: "还没答过"};
  if (b.available) return {key: "ready", zh: "已可较可靠估计"};
  const need = b.ceiling_need, r = b.confidence_r;
  const ratio = (need && need > 0 && r != null) ? (r / need) : 0;
  return ratio >= 0.9 ? {key: "near", zh: "快要能估计了"} : {key: "low", zh: "还不太可靠"};
}

function currentPrediction(code) {
  const payload = inferencePayload(code);
  const lib = window.EmoHealthInference;
  if (!payload || !payload.params || !lib) return null;
  const key = code + "|" + S.ansVer;
  if (_PRED.key === key) return _PRED.res;
  let res = null;
  try {
    res = lib.predictFrom(payload, S.instResp);
  } catch (err) {
    return {error: String(err && err.message || err)};
  }
  _PRED = {key, res};
  return res;
}

function renderInferencePanel(data, e) {
  if (!INFMAP[e.code]) {
    return `<div class="infpanel off" data-code="${esc(e.code)}" data-display="na">
      <b>各维度的目前估计：本量表不支持</b>
      <div class="note">这套量表没有题级统计参数，所以<b>不做估计</b>——
      只显示作答进度；答完后在「看结果」里给分数（有常模时给百分位）。</div></div>`;
  }
  const payload = inferencePayload(e.code);
  if (!payload || !window.EmoHealthInference) {
    return `<div class="infpanel loading" data-code="${esc(e.code)}" data-display="loading">
      <b>各维度的目前估计</b>
      <div class="note">正在准备估计所需的统计参数…（不影响作答）</div></div>`;
  }
  const pred = currentPrediction(e.code);
  if (!pred || pred.error) {
    return `<div class="infpanel off" data-code="${esc(e.code)}" data-display="error">
      <b>各维度的目前估计：暂时算不出来</b>
      <div class="note">这套量表的估计暂时不可用（不会用一个猜的数顶上）。</div></div>`;
  }
  const p = payload.params;
  const dims = Object.keys(p.dim_items || {});
  const rows = dims.map(dim => ({dim, b: (pred.inferred || {})[dim], o: (pred.official || {})[dim]}))
    .filter(x => x.b);
  const nm = x => (x.b && x.b.name) || dimNameOf(p, x.dim);
  // 排序：能给估计的靠前 → 可显示但还不可靠 → 一题未答（硬规则）
  const rank = x => x.b.display_allowed ? (x.b.available ? 0 : 1) : 2;
  rows.sort((a, b) => rank(a) - rank(b) || String(nm(a)).localeCompare(String(nm(b))));
  const nAllowed = rows.filter(x => x.b.display_allowed).length;
  const nReady = rows.filter(x => x.b.available).length;
  const nAnswered = data.items.filter(it => it.id in S.instResp).length;

  /* ── 默认视野：只列「已有估计 / 已可估计」的维度 + 一行汇总 ────────────
     D118（Lead 2026-10-05 裁决⑤）：未答的那 24 个维度逐行重复长句对真实用户
     就是噪音（移动端尤甚）。所以默认表只放**有状态的维度**（`display_allowed`：
     已答过该维度自己的题），未答维度收进**默认折叠**的「其余 N 个维度」里——
     **折叠表里的每一行仍然带完整 `data-*` 契约，且被挡维度依旧没有
     `data-r`/`data-pred`**（硬规则不因折叠而破）。
     精确 r、门槛、口径、样本量另在下面的「依据与出处」。 */
  const shownDims = rows.filter(x => x.b.display_allowed);
  const otherDims = rows.filter(x => !x.b.display_allowed);
  const dimRow = (x, blocked) => {
    const b = x.b, o = x.o || {};
    const own = b.n_answered_own || 0, need = b.n_items || (p.dim_items[x.dim] || []).length;
    const official = o.complete
      ? `<b>${(+o.value).toFixed(2)}</b>`
      : `<span class="note">答满后给出（还差 ${Math.max(0, need - own)} 题）</span>`;
    if (blocked) {
      // 硬规则①：连 r 都不显示，只写原因（原话保留在 data-reason 与依据折叠里）
      return `<tr data-dim="${esc(x.dim)}" data-display="blocked"
        data-status="${esc(b.status || "")}" data-available="0"
        data-reason="${esc(b.reason || "")}">
        <td>${esc(nm(x))}</td>
        <td>${official}</td>
        <td colspan="3" class="note">这个维度你<b>还没答过题</b>，
          所以先不给估计与可信程度（答它里面任意一题就会开始出现）。</td></tr>`;
    }
    const pct = (b.ceiling_pct == null) ? null : Math.max(0, Math.min(1, b.ceiling_pct));
    const lvl = confLevel(b);
    const valCell = b.available
      ? `<span class="infpred" data-pred="${b.predicted_score}"
           data-r="${b.confidence_r}">约 ${(+b.predicted_score).toFixed(2)}</span>
         <span class="infbadge" title="根据已答题目做的估计，不是已测出来的得分">估计</span>`
      : `<span class="note">还需要再答这个维度的一些题</span>`;
    return `<tr data-dim="${esc(x.dim)}" data-display="allowed" data-inferred="true"
      data-available="${b.available ? 1 : 0}" data-status="${esc(b.status || "")}"
      data-r="${b.confidence_r}"${b.available ? ` data-pred="${b.predicted_score}"` : ""}>
      <td>${esc(nm(x))}</td>
      <td>${official}</td>
      <td>${valCell}</td>
      <td data-level="${lvl.key}">${lvl.zh}</td>
      <td>${pct == null ? "—" : `${(pct * 100).toFixed(0)}%`}</td>
    </tr>`;
  };

  let h = `<div class="infpanel" data-code="${esc(e.code)}" data-display="ok"
    data-inferred="true" data-n="${nAnswered}" data-ready="${nReady}"
    data-shown="${shownDims.length}" data-others="${otherDims.length}">
    <div class="rowline"><b>各维度的目前估计</b>
      <span>已答 ${nAnswered}/${data.items.length} 题${
        nReady ? ` · ${nReady} 个维度已可较可靠估计` : ""}</span></div>
    <div class="note estnote">这些是<b>根据你已答的题目做出的估计</b>，<b>不是已经测出来的得分</b>；
      答完后在「看结果」里给正式得分。</div>`;
  if (shownDims.length) {
    h += `<table class="insttable inf"><thead><tr>
      <th>维度</th><th>完整得分</th><th>目前的估计</th><th>可信程度</th><th>信息充分度</th>
    </tr></thead><tbody>`;
    for (const x of shownDims) h += dimRow(x, false);
    h += `</tbody></table>`;
  } else {
    h += `<div class="note">还没有维度能给出估计——先答某个维度自己的题。</div>`;
  }
  if (otherDims.length) {
    h += `<details class="srcfold dimfold" data-dimfold="1">
      <summary>另有 ${otherDims.length} 个维度你还没答过题（点开看）</summary>
      <div class="srcbody">
      <div class="note">这些维度你还没答过题——答其中任意一题就会开始出现估计。</div>
      <table class="insttable inf"><thead><tr>
        <th>维度</th><th>完整得分</th><th>目前的估计</th>
      </tr></thead><tbody>`;
    for (const x of otherDims) h += dimRow(x, true);
    h += `</tbody></table></div></details>`;
  }
  /* ⚠️ D120（task-24）：这里原来有一个「依据」折叠，渲染了判据公式、模型名、
     `BLUP/回归`、`item_dim_corr_kind`、题级均值/SD 来源、门控比例、`ceiling_*note`、
     `N=` 样本量、`quality.basis`/`sample_note`、逐维度精确 `conf_r`/门槛……
     **全部删除**：用户来做测评，读这些不会改变他的作答或理解；可溯源是**项目内部**
     要求（文档层 + 数据层），界面不承担。精确数值仍在对用户不可见的 `data-*` 里。 */
  return h + `</div>`;
}

/* 只重绘推断面板（作答后调用；不整块重绘作答区，避免跳回顶部/节点失效） */
function refreshInferencePanel() {
  if (!INST_NOW || !S.instCode) return;

  const e = catalogEntry(S.instCode);
  const host = document.createElement("div");
