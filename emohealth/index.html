<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmoHealth · IPIP-NEO-300 自测陪伴</title>
<style>
  :root{
    --bg:#faf8f5; --card:#fff; --ink:#2b2a28; --ink2:#6b6862; --ink3:#a19d95;
    --line:#e8e4dd; --accent:#4a7c6f; --accent-soft:#e6efec;
    --warm:#b5836a; --warm-soft:#f5ece7;
    --locked:#dedad3; --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.04);
    --tier1:#8fb8ac; --tier2:#4a7c6f; --tier3:#2f5d52;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .wrap{max-width:1440px;margin:0 auto;padding:20px 20px 80px}
  h1{font-size:20px;font-weight:600;margin:0}
  h2{font-size:16px;font-weight:600;margin:0 0 12px}
  .top{display:flex;align-items:center;gap:16px;padding:16px 0 20px;flex-wrap:wrap}
  .modes{display:flex;gap:6px;background:#efece6;padding:4px;border-radius:10px}
  .modes button{border:0;background:transparent;padding:7px 16px;border-radius:7px;
    cursor:pointer;font-size:14px;color:var(--ink2);font-weight:500}
  .modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .spacer{flex:1}
  .meta{font-size:13px;color:var(--ink3)}
  /* ⚠️ 轨道必须写 `minmax(0, 1fr)`，不能只写 `1fr`：`1fr` 的最小值是内容的
     **min-content**，于是「面板里的 5 列表格」（min-content ≈ 330px）会把卡片撑到
     367.6px——在 360px 屏上被 `.layout{overflow-x:hidden}` **裁掉右侧约 24px**
     （实测：360×640 下 `#stage` 367.6、SVG 右边界 366.6 全都超出视口）。
     `minmax(0,1fr)` 让轨道可以缩到容器宽，宽内容改由**面板自己的** `overflow:auto`
     承接（不是整页裁切）。移动端布局门 `tools/check/check_mobile_layout.js` 钉住这条。 */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);
    gap:20px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:22px}
  /* 进度 */
  .bar{height:6px;background:#efece6;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
  /* 情景条 */
  .scenes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .scene-chip{border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 12px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;
    transition:.18s}
  .scene-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .scene-chip.on{border-color:var(--accent);background:var(--accent-soft);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .scene-chip.done{background:#f4f8f6;border-color:var(--tier1)}
  .scene-chip .n{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .scene-chip.done .n{color:var(--accent)}
  /* 题卡 */
  .qhead{font-size:12px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;
    margin-bottom:10px}
  .qtext{font-size:22px;line-height:1.5;font-weight:500;margin:6px 0 22px;min-height:66px}
  .qtext .rev{display:inline-block;font-size:12px;color:var(--warm);background:var(--warm-soft);
    border-radius:5px;padding:1px 7px;vertical-align:middle;margin-left:8px;font-weight:500}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:13px 16px;cursor:pointer;text-align:left;font-size:15px;
    color:var(--ink);transition:.14s;width:100%}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt .k{width:26px;height:26px;border-radius:7px;background:#f2efe9;display:grid;
    place-items:center;font-size:13px;color:var(--ink2);font-weight:600;flex:none}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .k{background:var(--accent);color:#fff}
  .navrow{display:flex;gap:10px;margin-top:18px;align-items:center}
  /* 「这题什么意思」——把 300 题脚手架递到用户手边 */
  .why{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
  .why summary{cursor:pointer;font-size:13px;color:var(--accent);list-style:none;
    display:inline-flex;align-items:center;gap:6px;user-select:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:"？";width:17px;height:17px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;
    font-size:11px;font-weight:700}
  .why[open] summary::before{content:"−"}
  .whybody{margin-top:12px;font-size:13.5px;line-height:1.75;color:var(--ink2)}
  .whybody b{color:var(--ink)}
  .whybody .k{background:#f6f3ee;border-radius:5px;padding:1px 6px;font-size:12.5px;
    color:var(--ink)}
  .whybody .mis{margin:8px 0 0;padding:0;list-style:none}
  .whybody .mis li{padding:5px 0 5px 14px;position:relative;border-bottom:1px solid #f6f3ee}
  .whybody .mis li:last-child{border-bottom:0}
  .whybody .mis li::before{content:"×";position:absolute;left:0;color:var(--warm);
    font-weight:700;font-size:12px}
  .whybody .mis li em{font-style:normal;color:var(--accent)}
  .whybody .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .whybody .cols>div{background:#faf9f6;border-radius:8px;padding:9px 11px}
  .whybody .cols h5{margin:0 0 5px;font-size:12px;color:var(--ink3);font-weight:600}
  .whybody .cols ul{margin:0;padding-left:15px}
  .whybody .loc{margin-top:10px;background:var(--warm-soft);border-radius:8px;
    padding:9px 11px;color:#7a5a48;font-size:13px}
  /* 结果里的面向详情 */
  .facet{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
  .facet h4{margin:0 0 4px;font-size:14.5px}
  .facet .band{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
  .facet .raw{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
  .facet .def{font-size:13.5px;color:var(--ink2);margin:8px 0}
  .facet details{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .facet details summary{font-size:12.5px;color:var(--accent);cursor:pointer;
    list-style:none}
  .facet details summary::-webkit-details-marker{display:none}
  .facet details summary::before{content:"▸ "}
  .facet details[open] summary::before{content:"▾ "}
  .facet details .d{font-size:13px;color:var(--ink2);line-height:1.7;margin-top:8px}
  .facet details .d ul{margin:6px 0 0;padding-left:16px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 18px;
    cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.92}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  /* 技能树 */
  .dom{margin-bottom:14px}
  .domname{font-size:11px;letter-spacing:.08em;color:var(--ink3);margin-bottom:6px;
    text-transform:uppercase}
  .sk{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
  .skname{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sk.locked .skname{color:var(--locked)}
  .dots{display:flex;gap:2px;flex:none}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--locked)}
  .dots i.f{background:var(--accent)}
  .dots i.f.t1{background:var(--tier1)} .dots i.f.t2{background:var(--tier2)}
  .dots i.f.t3{background:var(--tier3)}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;flex:none;
    background:#f2efe9;color:var(--ink3);font-variant-numeric:tabular-nums}
  .badge.u1{background:#eef4f2;color:#6f9c8f}
  .badge.u2{background:#e3efeb;color:#417a6c}
  .badge.u3{background:#d6e9e3;color:#2f5d52}
  .legend{font-size:11.5px;color:var(--ink3);margin-top:14px;padding-top:12px;
    border-top:1px solid var(--line);line-height:1.7}
  /* 结果 */
  .res h3{font-size:14px;margin:20px 0 8px;color:var(--ink)}
  .res h3:first-child{margin-top:0}
  .res .hint{font-size:12.5px;color:var(--ink3);margin:0 0 10px}
  .res ul{list-style:none;padding:0;margin:0}
  .res li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f4f1ec;font-size:13.5px}
  .res li:last-child{border-bottom:0}
  .res .fi{color:var(--ink2);flex:none;width:104px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .res .pct{flex:none;width:58px;text-align:right;font-variant-numeric:tabular-nums;
    color:var(--accent);font-weight:600}
  .res .pct.neg{color:var(--warm)}
  .res .tx{color:var(--ink);flex:1}
  .res .rv{color:var(--warm);font-size:11px;margin-right:3px}
  .warn{background:var(--warm-soft);border-left:3px solid var(--warm);border-radius:0 8px 8px 0;
    padding:11px 14px;font-size:13px;color:#7a5a48;margin-top:16px;line-height:1.6}
  .note{font-size:12.5px;color:var(--ink3);margin-top:10px}
  .empty{color:var(--ink3);font-size:14px;padding:40px 0;text-align:center}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#2f5d52;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;
    opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 保存与导出 */
  .io{display:flex;gap:8px;align-items:center;position:relative}
  .io button{border:1px solid var(--line);background:#fff;border-radius:9px;
    padding:7px 13px;cursor:pointer;font-size:13px;color:var(--ink);font-weight:500}
  .io button:hover{border-color:var(--accent)}
  .io button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .menu{position:absolute;top:110%;right:0;background:#fff;border:1px solid var(--line);
    border-radius:11px;box-shadow:var(--shadow);padding:6px;min-width:240px;display:none;z-index:20}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;padding:9px 12px;
    border-radius:7px;font-size:13.5px;background:transparent}
  .menu button:hover{background:var(--accent-soft)}
  .menu .sub{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px;
    font-weight:400;line-height:1.5}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
  .saved{font-size:12px;color:var(--ink3);white-space:nowrap}
  /* ── 天赋树 ───────────────────────────────────────── */
  /* 图是主角：给它尽可能宽的一列。原先面板列 400px 把 viewBox 1060 压成
     ~665px 显示（缩放 0.63），节点半径与字号按比例一起缩水——
     「看不看得清」直接取决于这一行的比例，而不是 font-size 写多少。 */
  .tree{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
  @media(max-width:1180px){.tree{grid-template-columns:1fr}}
  /* 分级模式下天赋树是主角：主区通栏，右侧技能条收起 */
  .layout.tier{grid-template-columns:minmax(0,1fr)}
  .layout.tier #treecard{display:none}
  .graphbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:10px;position:sticky;top:16px}
  .graphbox svg{display:block;width:100%;height:auto}
  .nd{cursor:pointer;transition:.15s}
  .nd circle{transition:.2s}
  .nd.locked{cursor:not-allowed}
  .nd:not(.locked):hover circle{r:11}
  .nd.rec circle{filter:drop-shadow(0 0 5px rgba(181,131,106,.45))}
  .nd.sel circle{stroke-width:2.5}
  .nd.ans circle{stroke:#fff;stroke-width:1.5}
  .ringlbl{font-size:13px;fill:var(--ink3);font-variant-numeric:tabular-nums}
  .ringlbl.cur{fill:var(--accent);font-weight:600}
  .facetlbl{font-size:12px;fill:var(--ink3);pointer-events:none}
  .facetlbl.on{fill:var(--ink2)}
  .domlbl{font-size:15px;fill:var(--ink2);font-weight:600;letter-spacing:.04em}
  .centerlbl{font-size:11px;fill:var(--ink3)}
  .treelegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);
    padding:8px 6px 4px}
  .treelegend i{display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:4px;vertical-align:-1px}
  /* ── 窄屏 / 移动端 ────────────────────────────────────────────
     SVG 的半径与字号随「viewBox→显示宽度」整体缩放，所以光靠 CSS 缩图会把
     节点压到 4px、手指点不准。这里的做法是：**窄屏下把几何与字号放大**
     （见 NR_OF()），同时减掉容不下的文字（支线名、图例的长说明），
     只留「点节点作答」这一句提示。 */
  .hhint{display:none;font-size:12.5px;color:var(--ink3);text-align:center;
    padding:2px 6px 8px}
  @media(max-width:700px){
    .hhint{display:block}
    .wrap{padding:10px 8px 60px}
    /* 卡片的内边距要小：`.wrap` 与 `.card` 是**嵌套**的，14px+14px 一下吃掉 56px
       宽度，而图是正方形、宽度直接决定高度——把卡片撑满，图才会真的变大（实测
       图曾被卡在 300×300，就是因为 graphbox 只有 310 宽）。 */
    .card{padding:8px}
    .panel{padding:12px;min-height:0}
    /* ── 作答区固定在屏幕底部（D109）──────────────────────────────
       先试过「让图与作答区同屏」，但**数学上做不到**：390×844 上
       页头 226 + 图 364 + 作答区 324 = 914 > 844。硬塞只有两条路——把图压到
       100px（没法看）或把选项挤出屏幕（没法答）。
       所以改成底部固定条：选中题后**选项永远在视野里**，页面只在「图 ↔ 结果」
       之间滚。这正是要的效果——「不用每次上下划动」。
       折起态、未选中题时它同时就是**推荐条**，所以「推荐常驻」也由它保证。
       ⚠️ 两个测量出来的坑（别照直觉改）：
       ① graphbox 必须给 `width:100%`，否则它的宽度由内容决定，svg 里的 `100%`
          会解析成自己的内禀尺寸（900 单位被矮高度压成 300px），图永远是 300×300；
       ② 所以 svg 用 `max-height` + `aspect-ratio` 而不是 `width:min(100%, …)`
          （实验：min(100%, 374px) → 300px，而 calc(100dvh − 348px) 单独用 → 496px）。 */
    #stage.tree{padding-bottom:0}
    #stage.tree .graphbox{position:static;padding:4px;margin-bottom:0;min-height:0;
      width:100%;height:auto}
    #stage.tree .graphbox svg{display:block;margin:0 auto;width:100%;height:auto;
      aspect-ratio:1 / 1;max-height:52dvh}
    #stage.tree .panelwrap{position:static;margin-top:8px}
    /* 常驻条：底部固定 + 自身可滚（内容多时不会顶穿屏幕；键盘弹出也不盖满屏） */
    #stage.tree #nextq{position:fixed;left:0;right:0;bottom:0;z-index:30;
      border-radius:14px 14px 0 0;border-bottom:0;margin:0;
      max-height:56dvh;overflow:auto;
      padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -8px 24px rgba(0,0,0,.13)}
    /* 给固定条让位，否则页面最后一段会被它永久遮住 */
    body{padding-bottom:30dvh}
    #stage.tree #nextq .qtext.nq{font-size:19px;margin:2px 0 12px}
    #stage.tree #nextq .opt{padding:11px 14px}
    #stage.tree #nextq .nqlist .nqpick:nth-child(n + 3){display:none}
    #stage.tree #nextq .nqpick{padding:8px 10px}
    #stage.tree #nextq .nqtxt{font-size:13px;line-height:1.35}
    #stage.tree #nextq .nqmeta{font-size:11px}
    /* 矮屏（≤700px 高）再收紧：360×640 上按上面的尺寸只放得下 3/5 个选项
       （实测），而「不用滚动就能答」是这条设计的底线。
       5 个选项改**两列**：高度直接减半，且手机上一列 5 个按钮本身也不好点。 */
    @media(max-height:700px){
      #stage.tree #nextq{max-height:54dvh;
        padding:9px 10px calc(9px + env(safe-area-inset-bottom, 0px))}
      #stage.tree #nextq .qtext.nq{font-size:17px;margin:0 0 8px}
      #stage.tree #nextq .opts{grid-template-columns:1fr 1fr;gap:6px}
      #stage.tree #nextq .opt{padding:8px 10px;font-size:13.5px;gap:8px}
      #stage.tree #nextq .opt .k{width:21px;height:21px;font-size:11.5px}
      #stage.tree #nextq .nqhead{font-size:12.5px;margin-bottom:4px}
      /* 「这题什么意思」在矮屏是整条里最占地方的一块，折起来时压到一行 */
      #stage.tree #nextq .why{margin-top:8px;padding-top:8px}
      body{padding-bottom:26dvh}
    }
    /* 增益那段解释在常驻条里太占地方（判断依据已在卡片的「可消除 N%」上） */
    .nqgain{display:none}
    /* 图例是重复信息（颜色含义在常驻条里就够），窄屏收掉 */
    .treelegend{display:none}
    .ptoggle{margin:8px 0 0}
    .nextq .qtext.nq{font-size:19px}
    /* 图形的字号也必须放大：SVG 会整体缩放，390px 宽的卡片把 900 单位的图
       压到 0.43 倍，13px 的字只剩 5.6px。这里是按缩放比例反向补偿。 */
    .facetlbl{font-size:20px}
    .domlbl{font-size:24px}
    .confrow{font-size:12px;padding:6px 8px}
    .confrow .cr{width:48px}
    .conf{max-height:none}                   /* 手机上不嵌套滚动条 */
    .qtext{font-size:19px}
    .layout{overflow-x:hidden}
  }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:22px;min-height:280px}
  .panel .ph{font-size:12px;letter-spacing:.06em;color:var(--ink3);margin-bottom:10px}
  /* 面板可折起：窄屏上面板在图下方，图占满一屏更实用（D103） */
  .panelwrap{min-width:0}
  .ptoggle{display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:#fff;border-radius:12px;padding:11px 14px;font:inherit;font-size:13.5px;
    color:var(--ink2);cursor:pointer;box-shadow:var(--shadow);margin-bottom:12px}
  .ptoggle:hover{border-color:var(--accent)}
  .ptoggle b{color:var(--accent)}
  .ptoggle.on{border-color:var(--tier1);background:#f7fbf9}
  /* ── 「下一题」常驻区 ───────────────────────────────────────────
     用户要的是「不想在图上点圆圈时也能顺着答」，所以它放面板最上面，
     而且不是折叠区——永远可见。 */
  .nextq{border:1px solid var(--line);border-radius:12px;padding:14px;
    background:linear-gradient(#fbfdfc,#fff);margin-bottom:16px}
  /* ── 多量表：量表选择器与单量表分页作答 ───────────────────────── */
  .instgroup{margin-bottom:18px}
  .instgrouph{display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;
    padding-bottom:6px;border-bottom:1px solid var(--line)}
  .instgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .instcard{display:grid;gap:3px;text-align:left;border:1px solid var(--line);
    background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;
    font:inherit;color:inherit;transition:border-color .15s,background .15s}
  .instcard:hover{border-color:var(--accent);background:#f7fbf9}
  .instname{font-size:13.5px;font-weight:600;line-height:1.35}
  .instmeta{font-size:12px;color:var(--ink3)}
  .instlic{font-size:11px;color:var(--accent);background:#eef5f2;border-radius:5px;
    padding:1px 6px;justify-self:start}
  .institems{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  .institem{padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .institem:last-child{border-bottom:0}
  .insttext{font-size:16px;line-height:1.5;margin-bottom:8px}
  /* 英文原题：小一号、灰一点，保留是为了能随时对照（D112：中译必须与原文成对） */
  .insten{font-size:12.5px;line-height:1.45;color:var(--ink3);margin:-4px 0 8px}
  /* 情景块（schema 2.1 / D121）：题干下方的一句场景说明——「这句话在什么场景下成立」。
     **答题必需 → 默认可见、不折叠**；与题干区分：左侧细色条 + 次级墨色 + 略小字号。
     ⚠️ 色条**不用品牌色**（--accent 是提醒/注记用的），免得被误读成「警告」。
     `overflow-wrap` 兜底：情景里若混有长英文串，320px 窄屏也不能横向溢出。 */
  .scene{margin:0 0 10px;padding:6px 10px;font-size:13px;line-height:1.55;
    color:var(--ink2);background:#fbfbfa;border-left:3px solid #cdd6d1;
    border-radius:0 6px 6px 0;overflow-wrap:break-word;word-break:break-word}
  /* ⛔️ 原来这里有一条 `.instnote`（逐题注释）样式，对应的是**译者备忘**回退
     （task-40 已删除：备忘永不上界面）。样式一并删掉——留着它等于给「再塞一次备忘」
     留了门。用户可见注记走 `.instnotes`（作答注记 `notes_zh`）与 `.scene`（情景）。 */
  /* 作答指示语（非题项）：不参与计分，样式上明显区别于题项 */
  .institem.instr{background:#fafafa;border-radius:8px;padding:10px 12px}
  .institem.instr .insttext{font-weight:600;font-size:15px;margin-bottom:4px}
  .inlinopts{display:flex;gap:8px;flex-wrap:wrap}
  .inlinopts .opt{flex:1 1 0;min-width:64px;justify-content:center;padding:9px 10px}
  /* ⚠️ 这里**不能** `display:none` 把分值藏掉：分值就是这一档的答案，
     用户点的是「几分」。我一度因为把分值包进 <span class="k"> 而让按钮变成
     空白圆角块——出图核对时才发现。统一作答格式的量表要显示分值，
     每题自带文字选项的量表（.longopts）显示分值小圆标 + 文本。 */
  .inlinopts .opt .k{font-weight:500}
  /* 选项文本较长时（Mania 的整句陈述、Repetitive 的各题锚点）竖排，
     并把分值显示成前面的小圆标签，方便对照。 */
  .longopts{display:grid;gap:6px}
  .longopts .opt{justify-content:flex-start;gap:10px;padding:10px 12px;
    text-align:left;line-height:1.45}
  .longopts .opt .k{flex:0 0 auto;min-width:22px;height:22px;border-radius:11px;
    background:#eef5f2;color:var(--ink3);font-size:12px;display:flex;
    align-items:center;justify-content:center}
  .longopts .opt.sel .k{background:var(--accent);color:#fff}
  .longopts .opt .ot{flex:1 1 auto}
  /* ── 题面四字段（D117）────────────────────────────────────────────
     `.ol` 把中英标签与选项情景说明竖排；`.ot` 仍是标签/整句陈述
     （test_mania_options_ui.js 钉住它），`.oz` 中译，`.om` 情景说明，
     `.omb` 依据类型小标（project_editorial 必须看得出来是「项目自撰」）。 */
  .opt .ol{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;
    text-align:left;min-width:0}
  .opt .oz{font-size:13.5px;font-weight:600}
  .opt .om{font-size:12px;color:var(--ink2);line-height:1.45;white-space:normal}
  .inlinopts .opt{align-items:flex-start;padding:9px 10px}
  .insten .entag{font-size:10px;color:var(--ink3);border:1px solid var(--line);
    border-radius:4px;padding:0 3px;margin-right:5px;vertical-align:1px}
  /* 作答注记（notes_zh）：默认可见（作答指示/敏感提示不能藏在折叠里） */
  .instnotes{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
  .instnotes li{font-size:12.5px;line-height:1.5;color:var(--accent);
    background:#f2f8f5;border-left:2px solid var(--accent);border-radius:0 6px 6px 0;
    padding:6px 10px}
  /* 来源可展开（硬规则③：每个数字/说明都能追到出处）。
     D118：**默认全部关闭**，且统一样式——用户端默认视野里不该出现溯源与专业口径。 */
  .srcfold{margin:2px 0 8px;font-size:11.5px;color:var(--ink3)}
  .srcfold summary{cursor:pointer;color:var(--ink3)}
  /* 「依据与出处」入口：低调但找得到（不抢作答视线） */
  .devfold{margin-top:8px}
  .devfold > summary{color:#9aa0a6}
  .devfold > summary::marker{color:#c4c9ce}
  /* 诚实性句子（估计≠已测得）：必须留在默认视野里，且要看得见 */
  .estnote{color:var(--ink2)}
  .srcbody{margin:4px 0 0;padding:5px 8px;background:#fafafa;border-radius:6px;
    line-height:1.5;word-break:break-word}
  /* 每题唯一「依据」折叠里的分块（原文来源 / 提醒来源 / 选项说明依据） */
  .srcbody .srcline{padding:3px 0}
  .srcbody .srcline + .srcline{border-top:1px dashed var(--line)}
  /* 整册作答指示（每页一次）。⚠️ 不能叫 .insthead——那是子页头部（返回/导出）
     D119：这是**量表级**提醒（作答指示 / 时间窗 / 反向计分 / 敏感提示 / 非诊断），
     一册只说一次；锚点级说明在 .anchorguide，选项级语义在选项里。 */
  .instrhead{background:#fafafa;border-radius:8px;padding:8px 11px;margin-bottom:12px;
    font-size:12.5px;color:var(--ink2);display:grid;gap:3px}
  /* 锚点级（每组尺子一次）：放在该组第一题上方，低调但可读 */
  .anchorguide{background:#f7fbf9;border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;padding:7px 10px;margin-bottom:10px;
    font-size:12.5px;color:var(--ink2);display:grid;gap:3px}
  .anchorguide .aglabel{font-size:11.5px;color:var(--ink3)}
  .anchorguide .agnote{line-height:1.5}
  .anchorguide .agquant{color:var(--ink3)}
  /* 敏感内容提示（作答前必须看到）：与一般说明区分开 */
  .instrhead .topicnote{border-left:3px solid var(--warm);padding-left:8px}
  /* ── 各指标预测 + 置信度面板 ─────────────────────────────────────
     ⚠️ **必须有高度上限**（`max-height` + 内部滚动）。否则 25 个维度 × 每行两行说明
     会把面板撑到 ~2600px——实测（360×640）把「第一道题」推到页面顶端下方 **3356px**、
     把天赋树图推到 **3674px**，即用户要滑 5 屏才看到题。面板是**仪表盘**，
     不该吞掉作答区。移动端再收紧一档。 */
  .infpanel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    margin:0 0 14px;background:#fcfdfc;
    max-height:min(46vh, 420px);overflow-y:auto;overscroll-behavior:contain}
  @media (max-width:700px){
    .infpanel{max-height:min(38vh, 300px);padding:8px 10px}
  }
  .infpanel .rowline{margin-bottom:4px}
  .infpanel table.inf{margin-top:6px}
  .infpanel table.inf td{font-variant-numeric:tabular-nums}
  .infpanel .infr{text-align:right}
  .infpred{font-weight:600}
  /* 「推断」徽章：推断值必须一眼看出不是官方分 */
  .infbadge{font-size:10.5px;color:#8a6247;background:#fdf6ef;border:1px solid #f0e4d5;
    border-radius:5px;padding:0 4px;margin-left:3px;white-space:nowrap}
  .infpanel.loading{border-style:dashed;color:var(--ink3)}
  .infpanel.off{background:#fafafa}
  /* 未答维度收进折叠（D118 裁决⑤）：默认视野只留有状态的维度 */
  .dimfold{margin-top:6px}
  .dimfold > summary{color:var(--ink3)}
  /* 页脚固定一行（D118 裁决①）：**授权署名要可见**（不只是「可查」），
     细节仍在「授权与来源」折叠里。 */
  .foot{margin-top:14px;padding:10px 2px 0;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;
    align-items:baseline}
  .foot .spacer{flex:1}
  .instnav{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .instnav .spacer{flex:1}
  /* 子页头部：返回 + 本量表自己的导出（用户要求「各自回答结果单独导出」） */
  .insthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .insthead .spacer{flex:1}
  .instheadcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    color:var(--ink3);background:#f3f5f4;border-radius:5px;padding:1px 6px}
  .instback{border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:6px 11px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
  .instback:hover{border-color:var(--accent)}
  /* 常模分层参数（task-39）：**只在 PID-5 出现**，可选、可清除、只存本机。
     视觉上刻意做得轻（一行 + 小字说明），不挡作答、不做必答、不反复提示。 */
  .stratum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:8px 10px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;
    background:#fbfbfa;font-size:13px}
  .stratum label{display:flex;gap:5px;align-items:center;color:var(--ink2)}
  .stratum select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:inherit}
  .stratum .stclear{border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:3px 9px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink2)}
  .stratum .stclear:hover{border-color:var(--accent);color:inherit}
  .stratum .stnow{font-size:12.5px;color:var(--ink3)}
  .stratum .stnote{font-size:12px;color:var(--ink3);flex-basis:100%;margin-top:2px}
  .expwrap{position:relative;display:inline-block}
  .expwrap>button{border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:6px 11px;cursor:pointer;font:inherit;font-size:13px;color:inherit}
  .expwrap>button:disabled{opacity:.5;cursor:default}
  .expwrap .expmenu{display:none;position:absolute;right:0;top:calc(100% + 6px);
    z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;min-width:210px}
  .expwrap:hover .expmenu,.expwrap:focus-within .expmenu{display:block}
  .expwrap .expmenu button{display:block;width:100%;text-align:left;border:0;
    background:transparent;border-radius:7px;padding:8px 10px;cursor:pointer;
    font:inherit;font-size:13px;color:inherit}
  .expwrap .expmenu button:hover{background:#f2f8f5}
  /* 结果页里的行内导出按钮 */
  .linkbtn{border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:3px 9px;margin:0 2px;cursor:pointer;font:inherit;font-size:12.5px;
    color:var(--accent)}
  .linkbtn:hover{background:#f2f8f5}
  /* 链路导航条：L1 → L2 → PID-5 的上下游跳转 */
  .chainbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#f7fbf9;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;margin-bottom:12px}
  .chainbar .spacer{flex:1}
  .chainlabel{font-size:12px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 8px;
    white-space:nowrap}
  .chainbar .note{font-size:12.5px;color:var(--ink2);margin:0}
  /* 作答方式切换（D114）：> 60 题的量表在「经典逐题」与「天赋树」之间切 */
  .viewswitch{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
  .viewswitch button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);
    background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;
    font-size:13px;color:inherit}
  .viewswitch button.on{border-color:var(--accent);background:#f2f8f5;font-weight:600}
  .viewswitch button[disabled]{cursor:default}
  .viewswitch .sub{font-size:11.5px;color:var(--ink3);font-weight:400}
  /* 天赋树 */
  .treewrap{display:flex;justify-content:center;margin:6px 0 4px}
  .treesvg{width:100%;max-width:720px;height:auto;overflow:visible}
  .treeedge{stroke:var(--line);stroke-width:1}
  .treenode{fill:#fff;stroke:var(--line);stroke-width:1.4;cursor:pointer;
    transition:fill .12s,stroke .12s}
  /* 可答节点：**浅底 + 粗描边**，比「白底细边」显眼得多
     （原来只靠描边，缩略看几乎与锁定节点分不出） */
  .treenode.open{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
  .treenode.done{fill:var(--accent);stroke:var(--accent)}
  .treenode.locked{fill:#eee;stroke:#e2e2e2;cursor:default}
  .treenode.sel{fill:#fff;stroke:var(--warm);stroke-width:3.2}
  /* 推荐的那一道另外描一圈虚线，避免在小图里被忽略 */
  .treenode.next{stroke:var(--warm);stroke-width:2.6;stroke-dasharray:3 2}
  /* 维度**已解锁**（置信度达标）：金色描边 + 暖底，与「可答」（浅绿底粗边）区分。
     ⚠️ 本维度一道题都没答时**绝不**加这个类（硬规则，见 treeUnlockState）。 */
  .treenode.ready{stroke:var(--warm);stroke-width:2.8}
  .treenode.ready:not(.done){fill:#fff7e6}
  .treenode.done.ready{stroke:var(--warm)}
  /* task-43：**因「相关/互补」新解锁**的节点。
     与其它四态的形状差（不只靠颜色）：
       · 外圈多一道**虚线光环**（`.bridgehalo`）——色盲/黑白打印也能分辨；
       · 本体是**实心暖底 + 最粗描边**，比「可答」（浅绿底粗边）更显眼；
       · 不加在已答节点上（`.done` 优先），因此不损害已答节点的可读性。 */
  .treenode.bridge{fill:#ffeccf;stroke:var(--warm);stroke-width:3.6}
  .treenode.bridge.next{stroke-dasharray:3 2}
  .bridgehalo{fill:none;stroke:var(--warm);stroke-width:1.4;stroke-dasharray:2 3;
    opacity:.85;pointer-events:none}
  .treelegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);
    margin:2px 0 6px;line-height:1.7}
  .treelegend i{display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:4px;border:1.6px solid var(--line);background:#fff;vertical-align:-1px}
  .treelegend i.done{background:var(--accent);border-color:var(--accent)}
  .treelegend i.ready{background:#fff7e6;border-color:var(--warm)}
  .treelegend i.open{background:var(--accent-soft);border-color:var(--accent)}
  .treelegend i.locked{background:#eee;border-color:#e2e2e2}
  /* 图例里的「新解锁」用**外环**表示，与图上节点的画法一致（形状线索） */
  .treelegend i.bridge{background:#ffeccf;border-color:var(--warm);
    box-shadow:0 0 0 2px #fff, 0 0 0 3.4px var(--warm)}
  .treebridge{border:1px solid var(--line);border-left:3px solid var(--warm);
    border-radius:10px;padding:8px 12px;margin:6px 0 4px;background:#fffdf8;font-size:13px}
  /* 下一题推荐卡：暖色左边框 + 浅底，与「推断面板」区分开 */
  .treereco{border:1px solid var(--line);border-left:3px solid var(--warm);border-radius:10px;
    padding:10px 12px;margin:8px 0 6px;background:#fffdf8}
  .treereco b{font-size:14px}
  .treeq{border:1px solid var(--line);border-radius:12px;padding:14px;
    background:linear-gradient(#fbfdfc,#fff);margin-top:12px}
  .instnav button{border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:8px 14px;cursor:pointer;font:inherit}
  .instnav button:disabled{opacity:.45;cursor:default}
  .insttable{width:100%;border-collapse:collapse;font-size:13.5px}
  .insttable th{text-align:left;font-weight:600;color:var(--ink3);font-size:12px;
    padding:6px 8px;border-bottom:1px solid var(--line)}
  .insttable td{padding:6px 8px;border-bottom:1px dashed var(--line)}
  .insttable .domrow td{font-weight:600;background:#f7fbf9}
  .insttable .note{color:var(--ink3);font-size:12px}
  .nextq .nqhead{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;font-size:13.5px;margin-bottom:8px}
  .nextq .nqhead b{font-weight:600}
  .nextq .qtext.nq{font-size:20px;line-height:1.5;font-weight:500;margin:4px 0 14px;
    min-height:0}
  .nqlist{display:grid;gap:8px}
  .nqpick{display:grid;gap:3px;text-align:left;border:1px solid var(--line);
    background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;
    transition:.15s}
  .nqpick:hover{border-color:var(--accent);background:var(--accent-soft)}
  .nqpick.first{border-color:#d9b79f;box-shadow:0 0 0 3px #f7efe9}
  .nqpick .nqtxt{font-size:14px;color:var(--ink);line-height:1.45}
  .nqpick .nqmeta{font-size:11.5px;color:var(--ink3)}
  /* 结果折叠区 */
  .peek{border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
  .peek.open{border-color:#b5836a}
  .peekhead{width:100%;display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;background:#faf8f4;border:0;font:inherit;font-size:13.5px;
    color:var(--ink);cursor:pointer;text-align:left}
  .peek.open .peekhead{background:#f6f1ea;color:#8a6247}
  .peekchev{font-size:12px;color:var(--ink3)}
  .peekbody{padding:12px 14px;border-top:1px solid var(--line)}
  .peekrow{display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;border-bottom:1px solid #f2efe9;font-size:13px}
  .peekrow:last-of-type{border-bottom:0}
  .peeknm{font-weight:600}
  .peekbd{color:var(--ink2);font-size:12.5px}
  .coolbar{padding:9px 14px;background:#fdf6ef;border-top:1px solid #f0e4d5;
    font-size:12.5px;color:#8a6247}
  .coolbar.big{border-radius:10px;border:1px solid #f0e4d5;margin-bottom:14px;
    text-align:center;font-size:13px}
  /* 逐面向的可信度清单（取代旧的「环进度条」） */
  .conf{max-height:298px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .confrow{display:flex;align-items:baseline;gap:8px;padding:6px 10px;font-size:12.5px;
    border-bottom:1px solid #f4f1ec}
  .confrow:last-child{border-bottom:0}
  .confrow .cn{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .confrow .ck{flex:none;width:34px;text-align:right;color:var(--ink3);
    font-variant-numeric:tabular-nums}
  .confrow .cr{flex:none;width:54px;text-align:right;color:var(--ink3);
    font-variant-numeric:tabular-nums}

<body>
<div class="wrap">
  <div class="top">
    <h1>EmoHealth · 自测陪伴</h1>
    <div class="modes" id="modes">
      <!-- 最小 UI（D116）：只有一个入口——量表库。分级/情景/经典等顶层模式、
           实时置信度推断与推荐答题已按用户要求从 UI 撤下。见 SCOPE-REDUCTION.md -->

<div class="toast" id="toast"></div>
<script src="catalog.js"></script>
<script src="instruments.js"></script>
<!-- 题面四字段与题级推断参数的**清单**（合计 < 1 KB）。真正的数据包
     （ui/items-structured/*.js，最大 1.4 MB；ui/inference/*.js，最大 434 KB）
     **只在进入某套量表的子页时注入**——首页不加载它们（实测 0 个脚本 / 0 条请求）。
     仍然用注入 script 标签而不是 fetch：file:// 下 fetch 被同源策略拒绝。
     ⚠️ 这里**故意不写尖括号**：博客仓库的部署门 `scripts/check-inline-scripts.mjs`
     用正则扫 `dist/**/*.html` 的**原始文本且不跳过 HTML 注释**——注释里出现字面的
     script 开标签会被它当成真的脚本开头，把到下一个 script 闭标签之间的内容拿去
     做语法解析，于是报「Unexpected identifier 'fetch'」。页面本身没问题（浏览器按
     注释处理，实测 Chrome 无报错），但门会红、CI 就上不去。改我们自己的文案比改
     别人的门稳妥。 -->
<script src="items-structured.js"></script>
<script src="inference.js"></script>
<!-- 历史产物仍在磁盘上（emohealth-data.js / tier-data.js / net-layout.js），
     由 tools/ui/pack_ui_data.py 的 --check 逐字节校验，供将来使用；首页不加载。 -->
<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   答题界面（D117）——两件：**题面四字段** 与 **各指标预测 + 置信度**

   ① 题面四字段：`ui/items-structured/<code>.js`（由 pack_ui_data 打包
      `data/items-structured/<code>.json`，606 题、四字段齐全率 100%）：
        · `text_zh` 中译（主体）  · `text_en` 原文（并列可读）
        · `response.options[].meaning_zh` 选它意味着什么（**选之前就要看到**）
        · `notes_zh[]` 作答注记（默认可见；来源可展开）
      每项都带来源（`text_zh_source` / `meaning_source` / 注记的 `source`），
      界面上**可展开查证**——IPIP-NEO 的 1500 条选项说明是 `project_editorial`
      （项目自撰），不得看起来像手册原文。

   ② 预测 + 置信度：`ui/lib/inference.js`（纯函数，与 `engine/inference.py` 逐值
      一致）＋ 按需注入的 `ui/inference/<code>.js`（由 pack_ui_data 调 engine 生成，
      含 `pairB64` / `item_dim_corr` / `dim_ceiling(_cross)` / `ceiling_ratio(_cross)`）。
      硬规则：**本维度一道题都没答 → 不展示该维度的预测与置信度**（只显示原因），
      不得因为别的维度答得多就放行。
      分层：`official`（量表声明口径，缺失不猜）与 `inferred`（一律标
      `inferred=true`）**分开呈现，绝不混算**；推断值文案不得写得像已测准的分数。
      ⚠️ 这与「作答中不给分值」的旧设计冲突（PLAN.md §2.5 防反刍）：用户本轮
      明确要求「预测+置信度」，所以给；但只给**推断**，官方分仍只在「看结果」页。
   ══════════════════════════════════════════════════════════════════════ */

/* ══ 多量表：按需加载 ═══════════════════════════════════════════════════

   为什么不能前置加载全部：现在有 40 套量表、2178 道题。全部前置要 0.9 MB 以上，
   而用户一次只答一套。所以拆成「目录（33 KB）+ 每套一个包（最大 41 KB）」，
   选中哪套才注入哪一个。

   为什么用 <script> 注入而不是 fetch()：项目要求纯静态、离线可用
   （ui/index.html 能 file:// 直接打开）。file:// 下 fetch 会被同源策略拒绝，
   而 <script src> 不受影响——这也是现有 5 个数据包一直用 <script> 的原因。

   数据包挂在 window.EMOHEALTH_INST_<CODE> 上（CODE 已正则化为标识符）。 */
const CATALOG = window.EMOHEALTH_CATALOG;          // {groups, instruments:[…]}
const INSTMAP = window.EMOHEALTH_INSTMAP;          // {code: 'instruments/xx.js'}
const INST_CACHE = new Map();

function instGlobal(code) {
  return "EMOHEALTH_INST_" + code.replace(/[^A-Za-z0-9]/g, "_").toUpperCase();
}

/* 已加载过的量表直接返回；否则注入 <script> 再取。 */
function loadInstrument(code) {
  if (INST_CACHE.has(code)) return Promise.resolve(INST_CACHE.get(code));
  const path = INSTMAP && INSTMAP[code];
  if (!path) return Promise.reject(new Error("目录里没有量表 " + code));
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = path;
    s.onload = () => {
      const data = window[instGlobal(code)];
      if (!data) { reject(new Error("数据包已加载但没有挂到 window：" + path)); return; }
      INST_CACHE.set(code, data);
      resolve(data);
    };
    s.onerror = () => reject(new Error("数据包加载失败：" + path));
    document.head.appendChild(s);
  });
}

/* 目录查询：按 code 取条目（界面要显示授权与来源，所以条目里保留这些字段）。 */
function catalogEntry(code) {
  return (CATALOG && CATALOG.instruments || []).find(x => x.code === code) || null;
}

/* ══ 题面四字段 / 题级推断参数：按需加载 ═══════════════════════════════

   两份清单（`ui/items-structured.js`、`ui/inference.js`，合计 < 1 KB）随首页加载；
   **数据包本身按需注入**（最大 1.4 MB / 434 KB）。与 `loadInstrument` 同一套做法：
   · 注入 `<script>`（file:// 下 fetch 被拒）；包自己把数据挂到 window
   · 带缓存 + **在途 Promise 去重**（重渲染会重复调用，没这张表会注入两次）
   · 没有该量表的数据就 reject/静默降级——界面照常作答，只是少一块信息 */
const STRUCTMAP = window.EMOHEALTH_STRUCTMAP || {};
const INFMAP = window.EMOHEALTH_INFERMAP || {};
const ONDEMAND = new Map();        // "kind|code" -> 数据
const ONDEMAND_PENDING = new Map(); // "kind|code" -> Promise

function ondemandGlobal(kind, code) {
  const prefix = kind === "struct" ? "EMOHEALTH_STRUCT_" : "EMOHEALTH_INFER_";
  return prefix + code.replace(/[^A-Za-z0-9]/g, "_").toUpperCase();
}

function loadOnDemand(kind, code) {
  const key = kind + "|" + code;
  if (ONDEMAND.has(key)) return Promise.resolve(ONDEMAND.get(key));
  if (ONDEMAND_PENDING.has(key)) return ONDEMAND_PENDING.get(key);
  const path = (kind === "struct" ? STRUCTMAP : INFMAP)[code];
  if (!path) return Promise.reject(new Error("没有该量表的" +
    (kind === "struct" ? "题面结构化数据" : "推断参数") + "：" + code));
  const p = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = path;
    s.onload = () => {
      const data = window[ondemandGlobal(kind, code)];
      if (!data) { reject(new Error("包已加载但没挂到 window：" + path)); return; }
      ONDEMAND.set(key, data);
      resolve(data);
    };
    s.onerror = () => reject(new Error("加载失败：" + path));
    document.head.appendChild(s);
  });
  ONDEMAND_PENDING.set(key, p);
  return p;
}
const loadStructured = (code) => loadOnDemand("struct", code);
const loadInference = (code) => loadOnDemand("inference", code);

/* `ui/lib/inference.js`（20 KB 纯函数库）同样按需注入：
   首页连它也不加载，保证「首页没有任何 inference 相关脚本」。 */
let _INFER_LIB = null;
function ensureInferenceLib() {
  if (_INFER_LIB) return _INFER_LIB;
  if (window.EmoHealthInference) { _INFER_LIB = Promise.resolve(window.EmoHealthInference); return _INFER_LIB; }
  _INFER_LIB = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "lib/inference.js";
    s.onload = () => window.EmoHealthInference
      ? resolve(window.EmoHealthInference)
      : reject(new Error("lib/inference.js 已加载但未挂到 window"));
    s.onerror = () => reject(new Error("lib/inference.js 加载失败"));
    document.head.appendChild(s);
  });
  return _INFER_LIB;
}

/* 当前量表的题面结构化记录（itemId → 记录）。没加载到就返回 null。 */
function structIndex(code) {
  const d = ONDEMAND.get("struct|" + code);
  if (!d || !d.items) return null;
  if (!d.__index) d.__index = new Map(d.items.map(it => [it.id, it]));
  return d.__index;
}
/* 结构化包本身（schema 2.0：`instrument_guide` / `scale_guides` / `items`）。
   ⚠️ **内部字段一律不上界面**：`scale_guides[*].source`、`label_source`、`options_source`、
   `instrument_guide.*_source`、`quantification.source` 都是核对用的出处字符串，
   用户点名不要（D119 / task-22 交接说明）。界面只读 `*_zh` / `label*` / `meaning_zh` /
   `quantification.text_zh` 这类**给用户看**的字段。 */
function structPayload(code) {
  return ONDEMAND.get("struct|" + code) || null;
}
function scaleGuideOf(code, scaleId) {
  const d = structPayload(code);
  return (d && d.scale_guides && scaleId && d.scale_guides[scaleId]) || null;
}
/* 当前量表的推断参数包（{params, pairB64, …}）；没加载到返回 null。 */
function inferencePayload(code) {
  return ONDEMAND.get("inference|" + code) || null;
}

/* 进子页时按需把「题面四字段 + 推断参数 + 推断库」备好，**新加载到了**才重渲染一次。
   ⚠️ 必须只在「这次真的去加载了」时回调：否则 `renderInstStage` →
   `ensureItemData` → 回调 → `renderInstStage` 会无限循环（实测会把页面跑死、
   浏览器测试直接挂住）。三者互不阻塞：缺哪个都不影响作答，只是少一块信息。 */
function ensureItemData(code, onReady) {
  const jobs = [];
  if (STRUCTMAP[code] && !ONDEMAND.has("struct|" + code)) jobs.push(loadStructured(code));
  if (INFMAP[code] && !ONDEMAND.has("inference|" + code)) {
    jobs.push(ensureInferenceLib().then(() => loadInference(code)));
  }
  if (!jobs.length) return;
  Promise.allSettled(jobs).then(results => {
    if (!results.some(r => r.status === "fulfilled")) return;
    if (S.mode !== "inst" || S.instCode !== code) return;
    onReady();
  });
}

/* ── 状态 ─────────────────────────────────────────────
   只有一种模式：题库（一次答一套量表，量表内分页）。
   上一版的 `resp/scene/result/tierSel/coolUntil/peekOpen/panelOpen` 等字段属于
   分级/情景模式，已随该模式一并删除。 */
const S = {
  mode: "inst",
  instCode: null,      // 选中的量表 code
  instPage: 0,         // 单量表内的页码（0 起）
  instResp: {},        // itemId -> 作答值
  ansVer: 0,           // 作答版本号：每次作答 +1（推断结果缓存按它失效）
  instResult: null,    // 该量表的计分结果（用户点「看结果」后才有）
  instView: "classic", // 作答方式："classic"（经典逐题）| "tree"（天赋树，仅 > 60 题）
  treeSel: null,       // 天赋树里选中的节点（题号）
  /* 最近作答的那道题的题号（task-43）：「当前节点」的兜底定义要用它
     （优先 `treeSel` 且已答；否则用最近作答的题）。 */
  lastAnsOrder: null,
  /* PID-5 条件常模的**分层参数**（性别 × 年龄）。见下方 STRATUM_* 一段：
     ⚠️ 它是**常模参数**，不是作答数据——单独存、单独清，绝不进 `instResp`/计分/存档作答位。 */
  normStratum: {sex: "", age: ""},
};
const INST_PER_PAGE = 10;      // 单量表分页：每页 10 题
/* ══ `r`（`conf_r`）的口径 —— **confidence-judge 定稿，照抄，不要改写成更技术的说法** ══
   为什么必须这么写：用户做了 220/220 全答满，报告却说「置信度 r=0.9307」，
   他读成「我的分只有 93% 可信」。而真相是：**这个 r 只看你答了哪些题、完全不看你答了什么**
   （全 0 作答与全 3 作答的 r 逐维相同，差 0.00e+00）——它是**这张问卷的性质**，
   不是**你这个人的性质**。答满时它停在该特质的「可辨上限」，**因此不会也不该是 1**。
   ⚠️ 这段文字里**不许出现** `bᵀA⁻¹b` / `pairB64` / `ceiling_ratio` / `dim_ceiling` 这类内部字段名。 */
const CONF_R_DEF_TEXT = "**r 说的是「这套题能把你这项特质辨到什么程度」，不是「你这次得分有多准」**"
  + "——它只取决于你**答了哪些题**，与你答出的具体分值无关。\n"
  + "  只答了一部分时，r 随已答题数与贴题程度变化，我们要求达到该特质**可辨上限的九成**"
  + "才会给出估计与位置；\n"
  + "  把该特质的题**全部答完**时，分数已经是精确值（估计 = 官方计分、误差为 0），"
  + "此时 r 停在**这套量表对该特质的可辨上限**，**因此不会、也不应该是 1**。";
/* 各特质可辨上限的**区间**：优先用本次导出里已答满面向的 r 现算（一个数一个来源）；
   导出里没有足够的已答满面向时，用 judge 给的经验区间（同一份定稿）。 */
const CONF_R_CEILING_RANGE_FALLBACK = "约 0.82–0.96";
/* ══ PID-5 条件常模的「性别 × 年龄」分层参数（task-39）══════════════════════
   为什么有它：`data/norms/pid-5.json` 是**条件常模**（9 个分层：f/m × [18,35)/[35,50)/
   [50,65)/[65,Inf) + overall）。不填时恒定用总体层 `overall`——换个性别年龄，同一个
   原始分的百分位最大能差 26.17 个百分点，甚至跨过 50/70 分档线。填了就用对应分层。
   ⚠️ 隐私边界（用户数据，硬约束）：
     ① **可选**：不填是默认且完全合法，绝不设为必答、绝不反复提示；
     ② **只存本机**（独立 localStorage 键），可**清除**；`file://` 离线单文件，无任何上传路径；
     ③ **不是作答数据**：绝不进 `S.instResp`、不进 responses/计分/推断，单独字段；
     ④ **导出克制**：报告只写**用了哪个分层码**（如 `f [35,50)`），不写「女性、35–49 岁」
        这种更直白的表述（分层码已足够表达，也更不容易被当临床信息误读）。
   落到百分位查询的唯一入口是 `instPercentileDetail(data, name, value, cell)` 的 `cell`。 */
const STRATUM_STORE = "emohealth.stratum.v1";
/* 年龄档 → 数据源里的分层后缀（**左闭右开**，与 `data/norms/pid-5.json` 一致） */
const STRATUM_AGES = [
  ["18-34", "[18,35)"], ["35-49", "[35,50)"],
  ["50-64", "[50,65)"], ["65+", "[65,Inf)"],
];
/* `lt18` 不是 UI 选项（不主动收集未成年人数据），但**存储/导入里若出现**必须有确定行为：
   数据源没有任何 <18 分层 → 用 `[0,18)` 这个必然不存在的键走同一个回退入口并说明原因。 */
const STRATUM_UNDER18 = "[0,18)";
function stratumState() {
  if (!S.normStratum || typeof S.normStratum !== "object") S.normStratum = {sex: "", age: ""};
  return S.normStratum;
}
function stratumRequestedCell() {
  const st = stratumState();
  const sex = (st.sex === "f" || st.sex === "m") ? st.sex : "";
  if (!sex || !st.age) return null;                 // 未填 → 交给入口走默认总体层
  if (st.age === "lt18") return sex + " " + STRATUM_UNDER18;
  const a = (STRATUM_AGES.find(x => x[0] === st.age) || [])[1];
  return a ? (sex + " " + a) : null;
}
function stratumUserWhy() {
  const st = stratumState();
  const sex = (st.sex === "f" || st.sex === "m") ? st.sex : "";
  if (!sex || !st.age) return "unfilled";
  return st.age === "lt18" ? "under18" : "filled";
}
function saveStratum() {
  try {
    const st = stratumState();
    localStorage.setItem(STRATUM_STORE,
      JSON.stringify({v: 1, sex: st.sex, age: st.age, at: Date.now()}));
  } catch (e) {}
}
function loadStratum() {
  try {
    const o = JSON.parse(localStorage.getItem(STRATUM_STORE) || "null");
    if (o && o.v === 1) {
      stratumState().sex = (o.sex === "f" || o.sex === "m") ? o.sex : "";
      stratumState().age = STRATUM_AGES.some(x => x[0] === o.age) || o.age === "lt18"
        ? o.age : "";
    }
  } catch (e) {}
}
function clearStratum() {
  S.normStratum = {sex: "", age: ""};
  try { localStorage.removeItem(STRATUM_STORE); } catch (e) {}
}
/* 天赋树（D114）：**只有 > 60 题、且有布局数据的量表**提供。短表全答一遍本来就快，
   天赋树的价值在长表上——用户不必手动翻 22 页。 */
const TREE_MIN_ITEMS = 61;
let TREE_NOW = null;           // 当前量表的树布局（从 ui/tree-layouts/ 按需加载）

/* ── 最小 markdown 渲染 ───────────────────────────────────────
   脚手架与 facet 档案的正文是按 markdown 写的，里面大量使用 **加粗**。
   直接塞进 innerHTML 会把星号原样显示出来（实测踩过）。
   只支持 **粗体** 一种——够用，且不会引入 XSS 面。            */
function esc(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function md(t) {
  return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

/* 顶部一行：量表库里给题库总量；某套量表里给「正在答哪一套 + 已答/题数」。 */
function renderTop() {
  const el = document.getElementById("topmeta");
  if (!S.instCode) {
    el.textContent = `题库：${(CATALOG && CATALOG.count) || 0} 套量表 · `
      + `${(CATALOG && CATALOG.total_items) || 0} 道题　｜　点任意一套进入它的子页`;
    return;
  }

    + (total ? `　｜　已答 ${n}/${total} 题（${(n / total * 100).toFixed(1)}%）` : "");
}
let INST_NOW = null;          // 当前已加载的量表数据（避免重复取）

function instAggregate(data, dimId, resp) {
  const rule = data.scoring[dimId];
  if (!rule) return null;
  const lo = data.response_format.min, hi = data.response_format.max;
  if (rule.scope === "dimensions") {
    const subs = rule.of.map(s => instAggregate(data, s, resp)).filter(x => x && x.complete);
    if (!subs.length) return null;
    const vs = subs.map(x => x.value);
    const value = rule.aggregation === "sum" ? vs.reduce((a, b) => a + b, 0)
      : vs.reduce((a, b) => a + b, 0) / vs.length;
    return {value, n_answered: subs.reduce((a, b) => a + b.n_answered, 0),
            n_items: subs.reduce((a, b) => a + b.n_items, 0),
            complete: subs.length === rule.of.length};
  }
  const byId = new Map(data.items.map(it => [it.id, it]));
  const coded = [];
  for (const iid of rule.of) {
    const it = byId.get(iid);
    if (!it || !(iid in resp)) continue;
    const v = +resp[iid];
    if (!(v >= lo && v <= hi)) continue;
    coded.push(it.key === -1 ? (lo + hi) - v : v);
  }
  if (!coded.length) return null;
  let value;
  if (rule.aggregation === "sum") value = coded.reduce((a, b) => a + b, 0);
  else if (rule.aggregation === "mean") value = coded.reduce((a, b) => a + b, 0) / coded.length;
  else if (rule.aggregation === "max") value = Math.max(...coded);
  else if (rule.aggregation === "count_true") {
    // 「>0 的项数」。DSM-5-TR L2 物质使用册用这个口径——原文明确**不求和**，
    // 而是逐项独立解释、以「几项 >0」表示严重度与复杂度。
    value = coded.filter(v => v > 0).length;
  } else throw new Error("未实现的聚合方式：" + rule.aggregation + "（仪表盘不支持，需先在引擎里加）");
  return {value, n_answered: coded.length, n_items: rule.of.length,
          complete: coded.length === rule.of.length};
}

function instScores(data, resp) {
  const out = [];
  for (const d of data.dimensions) {
    if (d.children && d.children.length) continue;
    const r = instAggregate(data, d.id, resp);
    if (r) out.push({id: d.id, name: d.name, ...r});
  }
  // 上级维度（域）另算
  for (const d of data.dimensions) {
    if (!d.children || !d.children.length) continue;
    const r = instAggregate(data, d.id, resp);
    if (r) out.push({id: d.id, name: d.name, ...r, isDomain: true});
  }
  return out;
}

/* ── 量表选择器 ─────────────────────────────────────────── */
function renderInstPicker(el) {
  const cat = CATALOG;
  if (!cat) { el.innerHTML = `<div class="note">目录未加载（catalog.js 缺失）。</div>`; return; }
  let h = `<div class="ph">题库 · ${cat.count} 套量表 · ${cat.total_items} 道题</div>
    <div class="note" style="margin-bottom:12px">一次只答一套。点进去会<b>分页</b>呈现，

  for (const g of cat.groups) {

    // 让内容更丰富的量表排前面。
    const codes = [...g.codes].sort((a, b) => {

    h += `<div class="instgroup"><div class="instgrouph">${esc(g.label)}
      <span class="note">${codes.length} 套</span></div><div class="instgrid">`;
    for (const code of codes) {
      const e = catalogEntry(code);
      if (!e) continue;
      h += `<button class="instcard" data-inst="${esc(code)}">
        <span class="instname">${esc(e.display_name)}</span>
        <span class="instmeta">${e.items} 题 · ${e.dimensions} 个维度</span>
        <span class="instlic">${esc(e.license.label)}</span>

    }
    h += `</div></div>`;
  }
  el.innerHTML = h;
}

/* 单量表导出：范围只含这一套。
   ⚠️ `it.note`（译者备忘）与 `it.scaffold` 已经**从发前端的量表包里删掉**（converge-pack），

   免得留一个永远为空、却让人以为「这题没有注释」的列（task-40）。 */
function instRows(data) {
  return data.items.map(it => ({
    order: it.order,
    id: it.id,
    dim: (it.dimensions || []).join("|"),
    key: it.key === -1 ? -1 : 1,
    en: it.text,
    zh: it.zh || "",
    value: (it.id in S.instResp) ? S.instResp[it.id] : "",
  }));
}

function instExportCSV(data, e) {
  const esc2 = v => {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  /* ⚠️ 表头**没有**「注释」列：那个概念（译者备忘）已经不存在了，
     留一个恒为空的列会被读者当成「这题没有注释」（task-40，Lead 裁决）。 */
  const head = ["题号", "题项ID", "维度", "计分键", "英文原题", "中文题面",
                "你的作答", "作答范围"];
  const rf = data.response_format;
  const rows = instRows(data).map(r => [
    r.order, r.id, r.dim, r.key, r.en, r.zh, r.value,
    `${rf.min}-${rf.max}`,
  ]);
  const csv = "\ufeff" + [head, ...rows].map(r => r.map(esc2).join(",")).join("\r\n");
  download(`${e.code}-逐题作答-${stamp()}.csv`, csv, "text/csv");
}

       它只用于「条件常模用哪一层」，**不是作答数据**、不参与计分/推断。

    norm_stratum: (data.norms && data.norms.scales) ? (() => {
      const rc = resolveNormCell(data.norms.scales[Object.keys(data.norms.scales)[0]],
        data.norms, stratumRequestedCell());
      return {

      dimension: r.name, value: r.value, answered: r.n_answered,

    })) : null,
    /* ── D122（task-34）：**结果快照**为新增字段，旧存档仍能导入 ──────────────
       `format` 不变（`emohealth.instrument.v1`），`instImportJSON` 只校验 format +
       `responses`，所以这里加字段**不破坏导入兼容**；导入后重新渲染即可还原报告所需
       的一切（报告数据全部可由 `responses` + 数据包重算，快照只是存档时的留痕）。
       ⚠️ 本函数在 `instReport` 之后定义，但导出是用户点击时调用，运行时序没问题。 */
    report_snapshot: (() => {

        const R = instReport(data, e);
        return {

            ceiling_ratio: R.infer.ceiling_ratio,

    })(),
