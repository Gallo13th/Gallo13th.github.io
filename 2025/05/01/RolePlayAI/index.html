      (() => {
        const KEY = 'lotte-theme';
        const root = document.documentElement;
        const isGiscusFrame = (el) => el instanceof HTMLIFrameElement && el.classList.contains('giscus-frame');

        // giscus 是懒加载的，client.js 在执行时才读 data-theme；
        // 这里在首次滚动之前把它改成我们解析出的主题（而不是让 giscus 自己猜系统偏好）。
        const syncGiscus = () => {
          const script = document.querySelector('script[data-giscus]');
          if (script) script.setAttribute('data-theme', root.dataset.theme === 'dark' ? 'dark' : 'light');
        };
        syncGiscus();

        document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try {
              localStorage.setItem(KEY, next);
            } catch (_) {}
            syncGiscus();
            // 已加载的评论框无需重载即可换肤
            document.querySelectorAll('iframe').forEach((frame) => {
              if (isGiscusFrame(frame)) {
                frame.contentWindow?.postMessage(
                  { giscus: { setConfig: { theme: next === 'dark' ? 'dark' : 'light' } } },
                  'https://giscus.app'
                );
              }
            });
          });
        });

        // 系统偏好变化时，仅在用户未手动选择过的情况下跟随
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          let saved = null;
          try {
            saved = localStorage.getItem(KEY);
          } catch (_) {}
          if (saved) return;
          root.dataset.theme = e.matches ? 'dark' : 'light';
          syncGiscus();
        });
      })();
    </script></body></html>
